  is_cain: true
- id: '2025-01-23'
  date: '2025-01-23'
  speaker: Newton Mwai Kinyanjui
  speaker_title: PhD candidate
  title: Improving treatment personalization with structures in sequential decision
    making
  affiliation: PhD candidate, Chalmers University of Technology
  time: 15:00 CET
  location: Lindholmsallén 10, Gothenburg
  city: Gothenburg
  venue_address: Lindholmsallén 10, Gothenburg
  photo: /assets/images/speakers/2025-01-23-newton-mwai-kinyanjui.jpg
  abstract: 'Personalizing treatments for patients involves a period during which
    different treatments from a set of available options are tried until an optimal
    treatment is found for particular patient characteristics. To minimize suffering
    and other costs, it is critical to reduce the duration of this search. When treatments
    have primarily short-term effects, the search can be conducted using multi-armed
    bandit algorithms (MABs). However, these algorithms typically require long exploration
    periods to guarantee optimality.


    With historical data, it is possible to identify structures that incorporate prior
    knowledge of the types of patients that may be encountered and the conditional
    reward models for those patient types. Such structural priors can be used to shorten
    the treatment exploration period, enhancing their applicability in real-world
    settings. Additionally, structures are beneficial in guiding how exploration is
    performed—switching treatments often incurs costs for the patient. Every time
    a treatment is changed, the patient must wean off their current therapy and adjust
    to the new treatment and its potential side effects.


    In this presentation, I will discuss how we leverage structures with latent bandits
    and batched bandits to design algorithms for treatment personalization.'
  bio: Newton is a PhD student in Computer Science and Engineering at Chalmers University
    of Technology, within the Healthy AI Lab. He works in machine learning to improve
    sequential decision making in healthcare using historical data. Prior to joining
    Chalmers, he earned a Master of Science in Electrical and Computer Engineering
    from Carnegie Mellon University.
  registration_url: extra2
  youtube_id: XQ43UVwBow0
  is_cain: false
- id: '2025-01-16'
  date: '2025-01-16'
  speaker: Chief Scientist Oscar Täckström
  title: From Enterprise Search to Intelligent Agents
  affiliation: Sana Labs
  time: 15:00 CET
  location: Isafjordsgatan 22, Kista
  city: Kista
  venue_address: Isafjordsgatan 22, Kista
  photo: /assets/images/speakers/2025-01-16-oscar-tackstrom.jpg
  abstract: 'The landscape of enterprise knowledge access is rapidly evolving from
    simple search and discovery, through intelligent assistants, and now towards reasoning
    agents. I will trace the progression of enterprise AI technologies along these
    three arcs focusing on the key drivers and give my perspective on where we’re
    headed and how we take this to heart at Sana.


    We''ll dive deep into the lessons we’ve learned from building Retrieval-Augmented
    Generation (RAG) in real-world contexts, examining how recent advances in test-time
    compute and agent architectures are reshaping our approach. Central to this exploration
    is how Large Language Models (LLMs) are fundamentally reimagining document understanding
    and information retrieval, enabling more nuanced, context-aware, and adaptive
    intelligent systems.'
  bio: 'Oscar Täckström is the Chief Scientist at Sana, where he leads all AI efforts.
    His research background is in natural language understanding and machine learning
    with notable contributions to attention-based models for language and video generation.
    Before joining Sana, he co-lead the technical development at Inceptive, applying
    deep learning to mRNA molecule design. Prior to that he was a senior research
    scientist at Google. He obtained his PhD from Uppsala University in 2013 and his
    publications won best paper and test of time awards at NAACL 2013 and ACL 2023.



    Sana is an AI company on a mission to advance how humans access knowledge with
