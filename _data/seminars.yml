- id: '2025-03-27'
  date: '2025-03-27'
  speaker: María J. Molina
  speaker_title: Assistant Professor
  title: Machine learning for Earth system prediction and predictability
  affiliation: Assistant Professor, University of Maryland
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-03-27-maria-j.-molina.jpg
  abstract: 'Machine learning can be used for Earth system prediction, or to study
    the uppermost limit of prediction skill theoretically achievable given the system''s
    initial state or other factors, otherwise known as predictability. In traditional
    numerical weather prediction frameworks, we solve the governing partial differential
    equations starting from an initial state. This initialized prediction framework
    usually involves three stages: 1) generating the initial conditions of the Earth
    system, 2) running the mathematical representation of the system on a computer
    forward in time, and 3) analyzing the output and converting it into a format that
    is useful for end users. Machine learning can be used to improve each of these
    individual stages, or to circumvent the three stage framework altogether, and
    examples of each will be given in this seminar. More time during the seminar will
    be dedicated to the challenges surrounding subseasonal prediction, which focuses
    on lead times of three to four weeks, and how we can use machine learning to both
    uncover potential biases in our initialized prediction systems and how we can
    bias-correct them.'
  bio: Dr. Maria J. Molina is an Assistant Professor at the University of Maryland,
    College Park, affiliated with the Artificial Intelligence Interdisciplinary Institute
    and the Institute for Advanced Computer Studies. She is also affiliated with NSF
    NCAR in Boulder, Colorado, serves as Vice Chair of the AMS Committee on AI Applications
    to Environmental Science, and is a member of the US CLIVAR PPAI panel and the
    WCRP ESMO Scientific Steering Group. She recently received NASA’s Early Career
    Investigator Award. Her research applies machine learning (e.g., neural networks)
    and numerical modeling (e.g., CESM) to climate and extreme weather studies, focusing
    on Earth system prediction, extreme event genesis, and multi-scale climate patterns.
    She emphasizes open-source tools, accessible communication, and interdisciplinary
    collaboration.
  registration_url: extra2
  youtube_id: buEFjJQ-0pc
  is_cain: true
- id: '2025-03-20'
  date: '2025-03-20'
  speaker: Oriol Nieto
  speaker_title: Researcher
  title: GenAI for sound design
  affiliation: Researcher, Adobe
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-03-20-oriol-nieto.jpg
  abstract: 'This presentation explores the forefront of generative AI research for
    sound design at Adobe Research. I will provide an overview of Latent Diffusion
    Models, which form the foundation of our work, and introduce several recent advancements
    focused on controllability and multimodality. I will begin with SILA [1], a technique
    designed to enhance the control of sound effects generated through text prompts.
    Following this, I will present Sketch2Sound [2], a model that generates sound
    effects conditioned on both audio recordings and text. Lastly, I will examine
    MultiFoley [3], a model capable of generating sound effects from both silent videos
    and text. Throughout the talk, I will showcase a series of examples and demos
    to illustrate the practical applications and potential of these models, making
    the case that we are only beginning to unveil a completely new paradigm in how
    to approach sound design.


    [1] Sonal Kumar, Prem Seetharaman, Justin Salamon, Dinesh Manocha, Oriol Nieto,
    "SILA: Signal-to-Language Augmentation for Enhanced Control in Text-to-Audio Generation",
    In review for IEEE SPL


    [2] Hugo Flores García, Oriol Nieto, Justin Salamon, Bryan Pardo, Prem Seetharaman,
    "Sketch2Sound: Controllable Audio Generation via Time-Varying Signals and Sonic
    Imitations", ICASSP 2025


    [3] Ziyang Chen, Prem Seetharaman, Bryan Russell, Oriol Nieto, David Bourgin,
    Andrew Owens, Justin Salamon, "Video-Guided Foley Sound Generation with Multimodal
    Controls", In review for CVPR 2025'
  bio: Oriol is a Senior Research Engineer at Adobe Research, where he focuses on
    human-centered AI for audio creativity, encompassing everything from music to
    audiobooks, video editing, and sound design. He holds a PhD in Music Technology
    from MARL, NYU, a Master's in Music, Science, and Technology from Stanford University,
    and a Master's in Information Technologies from Pompeu Fabra University. Highly
    involved with the Music Information Retrieval community, he was one of the three
    General Chairs for ISMIR 2024 in San Francisco this past November. Oriol has helped
    develop relevant open-source MIR packages such as librosa, mir-eval, and MSAF;
    contributed to PyTorch; and plays guitar, violin, cajón, and sings (and screams)
    in his spare time.
  registration_url: extra2
