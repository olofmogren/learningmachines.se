- id: '2022-11-17'
  date: '2022-11-17'
  speaker: Machine Learning Engineer Muhammad Osama
  title: Robust Risk Minimization for Statistical Learning from Corrupted Data
  affiliation: Aptiv
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-11-17-muhammad-osama.jpg
  abstract: We consider a general statistical learning problem where an unknown fraction
    of the training data is corrupted. We develop a robust learning method that only
    requires specifying an upper bound on the corrupted data fraction. The method
    minimizes a risk function defined by a non-parametric distribution with unknown
    probability weights. We derive and analyse the optimal weights and show how they
    provide robustness against corrupted data. Furthermore, we give a computationally
    efficient coordinate descent algorithm to solve the risk minimization problem.
    We demonstrate the wide range applicability of the method, including regression,
    classification, unsupervised learning and classic parameter estimation, with state-of-the-art
    performance.
  bio: I have a PhD in Electrical Engineering from Uppsala University where my research
    focused on machine learning (ML). During PhD, I have worked on several problem
    areas within ML e.g. statistical models for prediction in spatio-temporal data,
    causal inference and robust machine learning. Within robust machine learning,
    we looked at different aspects e.g. learning models when data is corrupted, when
    training and test distributions could be shifted, when data comes from different
    contexts/sources and the context is unknown at test time etc. After graduation,
    I have started working at Aptiv in Germany where I am applying machine learning
    to different perception related problems for automobile safety.
