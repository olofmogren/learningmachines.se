  abstract: In recent years, Machine Learning (ML) and Artificial Intelligence (AI)
    methods have begun to play a more and more enabling role in the sciences and in
    industry. In particular, the advent of large and/or complex data corpora has given
    rise to new technological challenges and possibilities. In his talk, Müller will
    touch upon the topic of ML applications in the sciences, in particular in neuroscience,
    medicine and physics. He will also discuss possibilities for extracting information
    from machine learning models to further our understanding by explaining nonlinear
    ML models. E.g. Machine Learning Models for Quantum Chemistry can, by applying
    interpretable ML, contribute to furthering chemical understanding. Finally, Müller
    will briefly outline perspectives and limitations.
  bio: Klaus-Robert Müller has been a professor of computer science at Technische
