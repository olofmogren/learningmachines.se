- id: '2022-09-29'
  date: '2022-09-29'
  speaker: Jörg Tiedemann
  speaker_title: Professor
  title: Translations as semantic mirrors - Representation learning with multilingual
    data
  affiliation: Professor, Helsinki University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-09-29-jorg-tiedemann.jpg
  abstract: Natural language processing has never been more popular than now and the
    success of neural NLP paved the way for ever-increasing expectations in general
    AI research and intelligent system development. The way that large language models
    can generalize to highly valuable representations of meaning is astonishing. Neural
    models support and combine sub-tasks of natural language understanding and generation
    and, in Helsinki, we are especially interested in translation models that naturally
    combine both sides of NLP research. FoTran is a project that studies the use of
    massively multilingual machine translation as a backbone for representation learning.
    The idea is that translations provide a rich signal for semantic abstractions,
    more than generative or masked language models. Our hypothesis is that increased
    linguistic diversity leads to better abstractions and we look at the internals
    of a neural model and their applications in various downstream tasks. In this
    talk I will present some of our studies that investigate the impact of multilingual
    training objectives on embedding spaces and their application in downstream tasks,
    and I will discuss ideas and directions for future work.
  bio: Jörg Tiedemann is professor of language technology at the Department of Digital
    Humanities at the University of Helsinki. He received his PhD in computational
    linguistics for work on bitext alignment and machine translation from Uppsala
    University before moving to the University of Groningen for 5 years of post-doctoral
    research on question answering and information extraction. His main research interests
    are connected with massively multilingual data sets and data-driven natural language
    processing and he currently runs an ERC-funded project on representation learning
    and natural language understanding.
