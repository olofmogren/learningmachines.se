- id: '2021-11-18'
  date: '2021-11-18'
  speaker: Martin Willbo
  title: Few-shot learning
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: Using machine learning methods for analysing recordings from different
    soundscapes are of great interest and a research area which can potentially lead
    to many societal benefits. Such tools could be of use in many different application
    areas, from city planning to research in biodiversity. For example, giving researchers
    an increased ability to estimate the number of individuals belonging to a species
    in the recording environment. Detecting different sound events in audio is one
    of the problems of soundscape analysis. However, for many of these different areas
    labelled training data is a scarcity. Few-shot learning is a highly promising
    paradigm for sound event detection since it is aimed to learn or define a model
    from just a few examples. This is a technique which previously have been mostly
    studied for other domains such as image classification but has gained more traction
    as a method for sound event detection with for example the DCASE challenges. In
    this talk, we will see some common approaches to few-shot learning and how they
    can be used to train models for sound event detection. In addition to this, some
    areas of future research are discussed for how to improve upon current techniques.
  bio: Martin Willbo recently graduated from Chalmers University of Technology with
    a master's in data science and Artificial Intelligence. Martin is employed as
    a junior researcher at RISE working on few-shot learning for sound event detection.
  youtube_id: Iy4bjl79Pj0
  is_cain: false
- id: '2021-11-11'
  date: '2021-11-11'
  speaker: Diarmuid Corcoran
  title: Reinforcement Learning for Automated Energy Efficient Mobile Network Performance
    Tuning.
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: Modern mobile networks are increasingly complex from a resource management
    perspective, with diverse combina- tions of software, infrastructure elements
    and services that need to be configured and tuned for correct and efficient operation.
    It is well accepted in the communications community that appropriately dimensioned
    efficient and reliable configurations of systems like 5G or indeed its predecessor
    4G is a massive technical challenge. One promising avenue is the application of
    machine learning methods to apply a data-driven and continuous learning approach
    to automated system performance tuning. We demonstrate the effectiveness of policy-gradient
    reinforcement learning as a way to learn and apply complex interleaving patterns
    of radio resource block usage in 4G and 5G, in order to automate the reduction
    of cell edge interference. We show that our method can increase overall spectral
    efficiency up to 25% and increase the overall system energy efficiency up to 50%
    in very challenging scenarios by learning how to do more with less system resources.
    We also introduce a flexible phased and continuous learning approach that can
    be used to train a boot-strap model in a simulated environment after which the
    model is transferred to a live system for continuous contextual learning.
  bio: Diarmuid Corcoran is an industrial PhD student at Ericsson and KTH. He is an
    expert in software implementation architecture, actively driving and participating
    in radio access network (RAN) software and system related activities. Diarmuid
    has contributed many key software implementation and system solutions to five
    generations of mobile technology. He is now exploring the early phases of 6G where
    his current research interests include methods, architectures and  algorithms
    for enabling self-learning resource management solutions with a focus on the implementation
    aspects of advanced automation.
  youtube_id: 75n-lgNC6k4
  is_cain: false
- id: '2021-11-04'
  date: '2021-11-04'
  speaker: Tuomas Virtanen
  speaker_title: Professor
  title: An overview of various acoustic scene analysis topics
  affiliation: Professor, Tampere University of Technology
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: Our everyday acoustic environments contain lots of sounds that carry information
    about events happening the environment. Automatic analysis of acoustic scenes
    has several applications, and has therefore attracted lots of research recently.
    This talk will first present core machine learning methods based on deep neural
    networks for acoustic scene classification, sound event detection, and sound event
    localization. Since data used to train systems plays a huge role in their development,
    it will also discuss what kind of data should be used to address these tasks,
    how such data can be obtained. Then the talk will discuss advanced machine learning
    topics which deal with limitations posed by training data as well as detailed
    analysis of acoustic scenes, including audio captioning, active learning, zero-shot
    learning, and domain adaptation for acoustic scene analysis.
  bio: Tuomas Virtanen (Fellow, IEEE) received the Doctoral degree from the Tampere
    University of Technology, Tampere, Finland, in 2006. He is currently a Professor
    with Tampere University, Tampere, Finland. He is known for his pioneering work
    on single-channel sound source separation using nonnegative matrix factorization
    and computational analysis of sounds in everyday environments. He has authored
    more than 200 scientific publications on these topics. He was the recipient of
    the IEEE Signal Processing Society 2012 Best Paper Award, and ERC 2014 Starting
    Grant “Computational Analysis of Everyday Soundscapes.”
  youtube_id: GLostckQRKo
