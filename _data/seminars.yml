- id: '2026-06-25'
  date: '2026-06-25'
  speaker: Markus Reichstein
  speaker_title: Professor
  title: Understanding the complex Earth system with Machine Learning and Hybrid Modelling
  affiliation: Professor, Max-Planck-Institute for Biogeochemistry and ELLIS Unit
    Jena
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2026-06-25-markus-reichstein.jpg
  abstract: 'The Earth system is a complex, dynamic and strongly interconnected system,
    shaped by interactions between climate, ecosystems, biogeochemical cycles and
    human activities. Rapidly growing streams of satellite, in-situ and experimental
    observations, together with advances in machine learning, offer new opportunities
    to detect patterns, infer processes and improve prediction across scales. Yet
    purely data-driven approaches often lack physical consistency and interpretability,
    while classical process-based models remain limited by uncertain parameterizations
    and incomplete representations of complex feedbacks.


    In this talk I will discuss how machine learning and hybrid modelling can help
    bridge this gap. By combining the versatility of data-driven methods with the
    constraints and explanatory power of mechanistic understanding, hybrid approaches
    can support more robust, interpretable and physically consistent models of the
    Earth system. Examples from the terrestrial biosphere, land-atmosphere exchange,
    carbon and water cycles, and climate extremes will illustrate how such approaches
    can contribute not only to improved prediction, but also to deeper scientific
    understanding of Earth system dynamics.'
  bio: Markus Reichstein is Director of the Biogeochemical Integration Department
    at the Max Planck Institute for Biogeochemistry and Professor for Global Geoecology
    at FSU Jena. His primary research interests center on how ecosystems respond and
    feedback to climatic variability, with a particular focus on the interplay between
    climate extremes and ecosystem resilience. To address these complex challenges,
    he combines artificial intelligence and system modeling approaches to exploit
    extensive ground- and satellite-based Earth observations. He is Program Director
    of the ELLIS Machine Learning for Earth and Climate Sciences program and founding
    Director of the ELLIS Unit Jena. Notably, he has served as a lead author for the
    IPCC Special Report on Climate Extremes (SREX) and was awarded the prestigious
    Gottfried Wilhelm Leibniz Prize in 2020. His groundbreaking collaborative research
    has also been supported by a major European Research Council (ERC) Synergy Grant.
  youtube_id: lPN4aVyfbD8
  is_cain: true
- id: '2026-06-11'
  date: '2026-06-11'
  speaker: Gustau Camps-Valls
  speaker_title: Professor
  title: A Critical Look at Explainable AI
  affiliation: Professor, University of Valencia
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2026-06-11-gustau-camps-valls.jpg
  abstract: 'I will give a sarcastic and quite op-ed tour trying to explain why XAI
    is misleading us. Everything from SHAP plots to counterfactuals may look trustworthy,
    but underneath, they''re often driven by correlations, not causation. In fields
    like climate, neuroscience and social sciences, that''s a serious risk. Inspired
    by philosophy of science, I argue that explanations must go beyond surface patterns.
    Fortunately, the frontier is moving fast: causal‐informed SHAP, meaningful counterfactuals
    (you can''t go younger), causal certification in explanations, and structural
    causal modeling are all promising. Yet, it''s time we treat XAI not just as a
    cosmetic fix, but as a tool grounded in truth: seamful, thought-provoking, and
    scientifically defensible. And if time allows I''d like to say a few words about
    why AI needs a new philosophy of science.'
  bio: Gustau Camps-Valls is a Full Professor of Electrical Engineering at the Universitat
    de València, where he leads the Image and Signal Processing (ISP) group. His research
    lives at the intersection of machine learning and Earth system science, focusing
    on combining deep learning with physical laws to better model and understand climate
    change. A widely recognized global leader in his field, he is Program Director
    of the ELLIS Machine Learning for Earth and Climate Sciences program. He is a
    Fellow of the IEEE, ACM, AGU, and Academia Europaea, and a highly cited researcher.
    His work has been supported by prestigious European Research Council (ERC) Consolidator
    and Synergy grants, and he was recently awarded the 2025 Blaise Pascal Medal.
    Beyond his research, he serves as a convener for the United Nations’ ITU AI for
    Good seminar series and holds visiting positions at the Institut Polytechnique
    de Paris and the Max Planck Institute. https://isp.uv.es
