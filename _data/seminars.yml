    of Prof. Konrad Schindler and Prof. Jan Dirk Wegner. During his master''s degree
    in Geomatics at ETHZ he discovered his fascination for machine learning and computer
    vision in the context of geodata sciences. Following on from work started during
    his earlier academic visit to Prof. Pietro Perona’s Computational Vision lab at
    Caltech, he has worked on deep learning approaches to monitor urban trees from
    street-level images. In his PhD, he developed an approach to compute a high-resolution
    canopy height model of the entire Earth by fusing optical satellite images with
    spaceborne LIDAR. His current research interests include quantifying the uncertainty
    in such estimates and learning from imbalanced data, which are ubiquitous challenges
    when working with real-world data. Website: https://langnico.github.io/'
