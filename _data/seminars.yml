- id: '2022-03-31'
  date: '2022-03-31'
  speaker: Martin Trimmel
  title: Linear Regions of Deep Neural Networks
  affiliation: Lund University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-03-31-martin-trimmel.jpg
  abstract: 'Many of the most widely used neural network architectures make use of
    rectified linear activations (ReLU, i.e. f(x) = max(x, 0)) and are therefore piecewise
    linear functions. The maximal subsets of the input space on which the network
    function is linear are called linear regions. If we want to better understand
    ReLU networks, it may be beneficial to understand these regions. There is the
    common intuition that the number of linear regions of neural networks measures
    their expressivity. Therefore a lot of focus has been placed on trying to obtain
    estimates of this number. However, this number is staggeringly high: Even very
    small networks have many more linear regions than there are atoms in the universe
    (10^80). This number is also much larger than the number of points in the dataset.
    This raises the question of how representative the number of linear regions is
    for network performance and how information extracted from training samples passes
    on to the many linear regions free of data for successful generalisation to test
    data. Our approach differs from previous ones focused on counting in that it investigates
    the linear coefficients associated to the linear linear regions. We propose TropEx,
    a tropical algebra-based algorithm extracting linear terms of the network function.
    This allows us to compare the network function with an extracted tropical function
    that agrees with the original network around all training data points, but which
    has much fewer linear regions. We also use our algorithm to compare different
    network types from the perspective of linear regions and their coefficients.'
  bio: Martin Trimmel has been a doctoral student at Lund University since October
    2017 under the supervision of Professor Cristian Sminchisescu. Martin obtained
    a Master of Advanced Studies degree from the University of Cambridge and a BSc
    degree from the University of Edinburgh. He did both his Master’s and Bachelor’s
    degrees in mathematics, focusing on algebra and algebraic geometry during his
    time at Cambridge. During his undergraduate studies Martin also spent a semester
    at Université Toulouse-Jean-Jaurès in France. In his research, Martin is interested
    in using mathematics to obtain a better theoretical understanding of deep learning.
    In particular, his previous work has focused on the effect the activations have
    on the network function and its performance.
  youtube_id: RM0wOvYkXDA
  is_cain: false
- id: '2022-03-24'
  date: '2022-03-24'
  speaker: Lovisa Hagström
  title: 'The issue with understanding language from text alone: an overview and potential
    solutions'
  affiliation: Chalmers
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-03-24-lovisa-hagstrom.jpg
  abstract: 'We have recently seen the development of complex language models capable
    of everything between writing news articles and generating stories about unicorns.
    These models outclass several natural language understanding tasks, and despite
    this they cannot answer basic questions relating to multiplication, how to get
    a table through a doorway or what the color of a dove is. Arguments that recently
    have arisen claim that this is expected, since a model that only ever has seen
    text cannot be expected to understand the meaning behind the words it sees, since
    the meaning lies somewhere outside of text. Thus, these powerful language models
    have recently been referred to as “stochastic parrots”.,

    ,

    A way that has been proposed to mitigate this issue is to connect the model with
    more information than text, such as images, sounds and effects of actions, that
    may provide the meaning behind the text. This is also referred to as “grounding
    the model". The proposed setup is not entirely dissimilar to how humans can read
    and write, but also interact with the outside world, by e.g. being able to see
    and hear. In my presentation, I will give an overview of this problem and the
    proposed solutions. I will also talk about my contributions to this research area.'
  bio: Lovisa Hagström is a PhD student at the department of Computer Science and
    Engineering at Chalmers University of Technology. She does research within Natural
    Language Processing (NLP) with a focus on making language models learn from more
    than text, where she is currently working with vision-language models. She has
    a master’s degree in Engineering Physics from Chalmers and spent one year studying
    abroad at the National University of Singapore. Her personal interests include
    cross-country skiing and running.
  youtube_id: CYohZwHmQCs
  is_cain: false
- id: '2022-03-17'
  date: '2022-03-17'
  speaker: Magnus Röding
  title: Microstructures and mass transport in porous materials - combining physics,
    statistics, and machine learning
  affiliation: RISE Research Institutes of Sweden
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-03-17-magnus-roding.jpg
  abstract: Understanding the microstructure of a porous material and how it relates
    to its mass transport properties (for example diffusion of particles, or fluid
    flow) is crucial for designing better materials. One example is coating layers
    on pharmaceutical pellets for controlled release of compounds, another is liquid
    transport through fibrous media in hygiene products. We combine e.g. image analysis,
    statistics, numerical simulations, and machine learning to characterize materials
    and to predict and understand their properties. In this talk, we will focus on
    the usefulness of machine learning in this field and discuss a number of example
    cases. First, semantic segmentation of 3D image data from focused ion beam scanning
    electron microscopy (FIB-SEM). Second, predicting parameters including the diffusion
    coefficient of fluorescent particles using fluorescence recovery after photobleaching
    (FRAP). Third, predicting microstructural parameters using small angle X-ray scattering
    (SAXS). Fourth, using machine learning methods for predicting mass transport properties
    of materials, which can be performed much faster than computing the properties
    through numerical simulations. Fifth, using those prediction models for optimizing
    and designing materials with desired properties. We will also discuss some interesting
    machine learning challenges that arise in connection to these examples.
  bio: Magnus Röding is a scientist at RISE in the department of Agriculture and Food
    and the Product Design unit in Gothenburg. He is also Adjunct Associate Professor
    in Mathematical Statistics at the Department of Mathematical Sciences, Chalmers
    University of Technology. His research interests concern modelling, statistics,
    and machine learning in connection to materials science and data analysis in imaging,
    microscopy, and other experimental techniques.
  youtube_id: hL6Xg1P3WzM
  is_cain: false
- id: '2022-03-10'
  date: '2022-03-10'
  speaker: Megan Stanley
  title: Molecular Property Prediction Using Few-Shot Learning Techniques
  affiliation: Microsoft Research Cambridge
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-03-10-megan-stanley.jpg
  abstract: A widely applied technique in early drug discovery to identify novel active
    molecules against a protein target is modelling quantitative structure-activity
    relationships (QSAR). However, small datasets are ubiquitous in drug discovery
    as data generation is expensive and can be restricted for ethical reasons (e.g.
    in vivo experiments). Therefore, QSAR prediction is known to be extremely challenging,
    as available measurements of compound activities range in the low dozens or hundreds.
    However, there are often large databases of related datasets, each with a small
    number of datapoints, opening up the opportunity for few-shot learning after pretraining
    on a substantially larger corpus of data. While many few-shot learning methods
    were developed and evaluated in the computer-vision domain, we demonstrate that
    application in the explicitly graph-structured molecular domain provides an increase
    in QSAR modelling performance. In particular, through use of a purpose-made few-shot
    learning dataset of molecules and evaluation procedure, we are able to compare
    the performance of a number of few-shot and meta-learning methods against standard
    single-task learners. We show that prototypical networks in particular are valuable
    in this domain, and that model-agnostic meta-learning is capable of AUPRC enhancement
    in the very low-data regime. We also implement a range of pre-trained, single-task
    and multitask baselines, and seek to encourage further development of methods
    to address tasks with very limited data availability.
  bio: Megan Stanley is a researcher at Microsoft Research, Cambridge, UK, currently
    working on applications of machine learning in the sciences and with particular
    interest in few-shot learning and generalization. She graduated from her PhD in
    Physics at the University of Cambridge in 2017.
  youtube_id: nv-2n8-aOBo
  is_cain: false
- id: '2022-02-24'
  date: '2022-02-24'
  speaker: Dan Stowell
  title: Deep models of animal listening perceptual tasks
  affiliation: Tilburg University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-02-24-dan-stowell.jpg
  abstract: 'Natural soundscapes contain valuable information, readily available,
    about biodiversity and animal behaviour. Indeed a revolution in acoustic monitoring
    is already underway, driven by deep learning (DL) and big data, as in other domains.
    But beyond basic recognition tools, what can we gain from high-resolution DL acoustic
    tasks? Can we use DL to explore animal perception, and would that help with biodiversity
    monitoring? I will present recent work on modelling animal acoustic cognitive
    tasks: song similarity in birds and echolocation flower recognition in bats, using
    data collected non-invasively from the animals themselves. I will focus on DL
    training scenarios designed to reflect the cognitive tasks.,

    ,

    REFERENCES:,

    (1) Morfi et al (2021) JASA, https://asa.scitation.org/doi/10.1121/10.0005475,,,,time,

    (2) Simon et al (2022) Plos Comp Biol, https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1009706'
  bio: "Dan Stowell is an Associate Professor of AI & Biodiversity working in the\
    \ Netherlands (Tilburg University, Naturalis Biodiversity Centre, JADS). His research\
    \ is about machine listening and computational bioacoustics - which means using\
    \ computation (especially machine learning) to understand animal sounds and other\
    \ sound signals.,\n,\nI develop automatic processes to analyse large amounts of\
    \ sound,\nrecordings - for example detecting the bird sounds in there and how\
    \ they,\n vary, how they relate to each other, how the birds' behaviour relates,\n\
    to the sounds they make. The research work is focussed on the machine,\nlearning\
    \ and signal processing methods that can help with these,\nquestions. I also work\
    \ with others to apply these methods to,\nbiodiversity monitoring.,\n,\nI am also\
    \ a Fellow of the Alan Turing Institute. I work with OpenClimateFix and OpenStreetMap\
    \ on addressing climate change through solar panel mapping.,\n,\nI use various\
    \ machine learning methods, including Gaussian processes, point process models,\
    \ feature learning... sure, yes, and deep learning too, lots of deep learning."
  youtube_id: 66syy3dXa5Y
  is_cain: false
- id: '2022-02-10'
  date: '2022-02-10'
  speaker: Jerk Rönnols
  title: Machine learning for experimental chemical and physical analysis
  affiliation: RISE Research Institutes of Sweden
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: 'This presentation will focus on the application of machine learning methods
    in the interpretation of data gathered in experiments aimed at describing the
    shape, structure or molecular composition of materials, via small angle x-ray
    scattering (SAXS) and nuclear magnetic resonance spectroscopy (NMR).,

    ,

    The challenges in both of these experimental methods lies in the interpretation
    of complex data sets, which can be time consuming and cumbersome even for trained
    experts – which also run the risk of introducing bias to the interpretations.
    Cases where ML-applications could both accelerate the interpretation and enhance
    the degree of understanding of a system have been identified.,

    ,

    More specifically, the systems studied and methods applied are as follows: For
    SAXS, both diluted and solid porous systems were studied. In the diluted systems,
    classification of the shapes of particles in liquid was investigated, using several
    classification algorithms. For solid porous systems classification of the type
    of material was investigated, but also regression analysis parameters describing
    the shape of the materials.,

    ,

    For the NMR spectroscopic investigations, the investigations were focused on determining
    the individual concentrations of a group of compounds in a mixture, through image
    analysis of two-dimensional spectra. There have also been investigations on predicting
    the spectral appearance from molecular structures.,

    ,

    The results from these studies and their significance for experimental scientists
    in their everyday work will be discussed.'
  bio: Jerk holds a PhD in Organic Chemistry from Stockholm University. He has been
    employed by RISE since 2014 and have primarily been working with development of
    methods for analysis of biobased materials with NMR spectroscopy, and other techniques.
    He is currently working on development of sustainable multifunctional materials.
  is_cain: false
- id: '2022-02-03'
  date: '2022-02-03'
  speaker: Josephine Sullivan
  title: 'Zero-shot learning: Harnessing text descriptions to learn unseen visual
    classes'
  affiliation: KTH
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: This presentation will have two parts describing recent research I have
    been involved with. Initially, I will focus on zero-shot learning - learning how
    to recognise novel visual classes from only text descriptions. This work introduces
    the Wiki-ImageNet database and shows that incorporating quality text descriptions
    within existing simple and SOTA zero-shot learning algorithms improves performance.
    The second part will deal with a more theoretical issue. The function parameterized
    by most ConvNets is piecewise affine. There is a body of work debating whether
    the density of regions in the piecewise function of a well-trained over-parametrized
    network is correlated with its expressiveness. In our recent work, we show empirically
    for the first time on realistic network architectures that region density may
    fall short of capturing meaningful nonlinearity of over-parameterized deep networks.
  bio: Josephine Sullivan is a lecturer in computer vision within the School of Computer
    Science and Communication (CSC) at the Royal Institute of Technology (KTH). Her
    research efforts are devoted to the field of computer vision, including visual
    tracking, human/object pose recognition and multi-target tracking. Josephine obtained
    a D.Phil from Oxford University, Dept. Of Engineering Sciences in 2001 under the
    supervision of Prof. Andrew Blake.
  is_cain: false
