- id: '2024-04-11'
  date: '2024-04-11'
  speaker: Alouette van Hove
  speaker_title: PhD Candidate
  title: Guiding drones by information gain
  affiliation: PhD Candidate, University of Oslo
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2024-04-11-alouette-van-hove.jpg
  abstract: 'Accurately estimating the location and strength of greenhouse gas sources
    remains a significant challenge in climate science, contributing to uncertainties
    in climate change projections. To address this issue, we develop a novel framework
    using atmospheric observations acquired via drones to infer the source location
    and emission rate of gas plumes. Through Bayesian inference, our framework aims
    to enhance the precision of greenhouse gas flux estimates. Ultimately, our objective
    is to facilitate the validation and calibration of existing models and metrics,
    thereby improving the reliability of climate change projections.


    One aspect of our framework’s development is finding the optimal sampling path
    for drones to collect informative data in unfamiliar environments. In this presentation,
    we explore two sampling strategies in a synthetic study.  Both strategies share
    a common goal: to maximize the information gained from sequential drone observations.
    We compare the nearsighted approach of infotaxis to a farsighted navigation strategy
    trained through deep reinforcement learning. Concluding the presentation, I will
    outline the subsequent steps in our research to implement the framework in real-world
    scenarios and discuss ongoing field experiments.'
  bio: Alouette van Hove is a Ph.D. student at the Department of Geosciences of the
    University of Oslo. She has a background in environmental science, aerospace engineering
    and software development. Her research focuses on reinforcement learning and Bayesian
    inference to estimate greenhouse gas fluxes using drone observations. She is interested
    in computational methods and the application of machine learning techniques to
    address environmental problems.
  registration_url: extra2
  youtube_id: GNG7SUixPhU
  is_cain: false
- id: '2024-04-04'
  date: '2024-04-04'
  speaker: Senior Research Scientist Karsten Kreis
  title: 'Visual Generative AI with Diffusion Models: From Static Pixels to Video,
    3D and 4D Synthesis'
  affiliation: NVIDIA Research
  time: '16:00'
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2024-04-04-karsten-kreis.jpg
  abstract: We are currently witnessing a generative AI revolution, not only in language
    modeling, but also in the visual domain. While only a decade ago the generation
    of detailed imagery seemed impossible, we can now routinely synthesize detailed
    and highly expressive images, videos, and even 3D and dynamic 4D content. In this
    talk, I will present a journey through the field of generative AI in the visual
    domain and explain some of the most important methods and techniques. I will review
    the foundations of diffusion models, which have led to major breakthroughs in
    large-scale image generation and now power most modern deep generative learning
    systems in the visual domain. I will also mention some of our works on advanced
    diffusion processes and accelerated diffusion model sampling.  Next, I will explain
    how diffusion models are used not only for image generation but can be extended
    to video generation, a task where we have seen rapid progress very recently. Further,
    I will discuss how text-to-image diffusion models are now widely utilized for
    static 3D object synthesis through score distillation sampling, an approach that
    optimizes individual 3D objects based on feedback from a pre-trained image diffusion
    model. Finally, I will show our work on combining score distillation sampling
    with video diffusion models for the generation of moving 3D objects, thereby enabling
    4D dynamic content creation with diffusion models.
  bio: Karsten Kreis is a Senior Research Scientist in the fundamental generative
    AI research team of NVIDIA Research. Karsten is interested both in fundamental
    generative AI algorithm development and in applying deep generative models in
    areas such as computer vision, graphics and digital artistry as well as to problems
    in the natural sciences. Before joining NVIDIA, Karsten worked on deep generative
    learning at D-Wave Systems and he co-founded Variational AI, a startup leveraging
    generative modeling for drug discovery. Karsten is trained as a physicist and
    did his master’s in quantum information theory and his Ph.D. in computational
    and statistical physics, developing multiscale molecular dynamics simulation methods.
    See his website https://karstenkreis.github.io/ for more details.
