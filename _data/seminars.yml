- id: '2023-11-30'
  date: '2023-11-30'
  speaker: Postdoctoral fellow Ben Weinstein
  title: General Models for Airborne Wildlife Detection. Where are we? Where are we
    going?
  affiliation: University of Florida
  time: '16:00'
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-11-30-ben-weinstein.jpg
  abstract: Ecology is undergoing rapid transformation in data collection. The broad
    adoption of automated tools for ecological monitoring has created enormous datasets
    of unlabeled sensor data. To transform these raw data into ecological inference,
    we need automated approaches for finding, counting and describing organisms. Computer
    vision, a form of image-based artificial intelligence, is a highly effective tool
    for developing large models for image-based ecological modeling. Using examples
    from airborne tree surveys and avian colony surveys, we demonstrate the benefits
    of airborne monitoring coupled with automated AI classification. Using multi-sensor
    deep learning models, we present landscape level maps for individual tree species
    for over 100 million canopy crowns within the NEON network. Using multi-temporal
    surveys from UAVs, we present an airborne workflow for estimating nesting phenology
    in Everglades nesting bird colonies. While these results open new avenues for
    research at unprecedented scales, there remain several obstacles to bringing AI
    advances to all ecologists. The combination of technical skill, significant annotation
    effort, and lack of model sharing severely limit the adoption of airborne ecological
    monitoring. To move beyond highly customized models for every application, we
    need general models that serve as a baseline for common ecological tasks from
    airborne imaging. I discuss the potential for general models and the hope for
    data integration across acquisition systems, taxa and geography.
  bio: Ben Weinstein obtained his PhD in Ecology and Evolution from Stony Brook University
    in 2016. He is currently a postdoctoral fellow at University of Florida, and studies
    the mechanisms that generate, maintain, and preserve biodiversity. Specifically,
    this includes the ecology of species interactions, hierarchical Bayesian models
    for ecological predictions, and machine learning for biodiversity image analysis.
  registration_url: extra2
  youtube_id: 7yXsFFbWgcs
  is_cain: false
- id: '2023-11-23'
  date: '2023-11-23'
  speaker: Senior Researcher Alisa Devlic
  title: Design of superhuman racing AI agent, Gran Turismo Sophy, trained through
    deep reinforcement learning
  affiliation: Sony AI
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-11-23-alisa-devlic.jpg
  abstract: Many potential applications of artificial intelligence involve making
    real-time decisions in physical systems while interacting with humans. Automobile
    racing represents an extreme example of these conditions; drivers must execute
    complex tactical maneuvers to pass or block opponents while operating their vehicles
    at their traction limits. Racing simulations, such as the PlayStation game Gran
    Turismo, faithfully reproduce the nonlinear control challenges of real race cars
    while also encapsulating the complex multi-agent interactions. Here we describe
    how we trained agents for Gran Turismo that can compete with the world’s best
    e-sports drivers. We combine state-of-the-art model-free deep reinforcement learning
    algorithms with mixed scenario training to learn an integrated control policy
    that combines exceptional speed with impressive tactics. In addition, we construct
    a reward function that enables the agent to be competitive while adhering to racing’s
    important, but under-specified, sportsmanship rules. We demonstrate the capabilities
    of our agent, Gran Turismo Sophy, by winning a head-to-head competition against
    four of the world’s best Gran Turismo drivers. By describing how we trained championship-level
    racers, we illuminate the possibilities and challenges of using these techniques
    to control complex dynamical systems in domains where agents must respect imprecisely
    defined human norms.
  bio: Alisa Devlic is a Senior Research Scientist at Sony AI, working on applying
    and advancing the state-of-the-art in deep reinforcement learning in the gaming
    domain. She obtained her Ph.D. in Communication Systems from KTH, Stockholm, Sweden
    and did her postdoctoral work at IMT Atlantique, Rennes, France. Before joining
    Sony AI, she worked both in industry labs (Ericsson Research and Huawei Technologies)
    and academia (KTH, IMT Atlantique, and University of Zagreb). Alisa (co)authored
    more than 30 papers and obtained best paper awards at IEEE WoWMoM 2015, ICC 2017
    and MMSP 2018. She was part of the Sony AI team who developed a GT Sophy, the
    first racing agent that can outperform the world’s best e-sports drivers and published
    results in the Nature journal. She started working in the field of Reinforcement
    Learning in 2020, when she joined Sony AI.
  registration_url: extra2
  youtube_id: -vffmJDBsaM
  is_cain: false
- id: '2023-11-16'
  date: '2023-11-16'
  speaker: speakertitle Jonas Hellgren
  title: Reinforcement learning - theory, toy problems from Open AI Gym, and application
    examples
  affiliation: RISE Research Institutes of Sweden
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-11-16-jonas-hellgren.jpg
  abstract: 'Reinforcement Learning (RL) is a paradigm of machine learning that focuses
    on training agents to make sequential decisions in an environment. This presentation,
    that is algorithm/math oriented, highlights the most essential concepts in RL.
    The concepts are needed to understand algorithm candidates for solving RL problems.
    The presentation also includes some toy-problems to increase the intuition of
    the concepts. Grid world and chart-pole are classical example toy problems. Real
    world applications are also presented.


    The talk will cover the following concepts: Markov Decision Processes serve as
    the foundational framework for modeling RL problems. They define the key components:
    states, actions, transition probabilities, and rewards. Reward Functions: The
    reward function encapsulates the objective of an RL task, guiding the agent towards
    desirable outcomes. Value Functions: Value functions estimate the expected cumulative
    reward associated with a state or state-action pair, aiding in decision-making.
    Policy: The policy defines the agent''s strategy for selecting actions in a given
    state, shaping its behavior.


    The following algorithms will be presented presented: Dynamic programming. Temporal
    Difference Learning: TD learning algorithms, such as Q-Learning and SARSA. Deep
    Q-Networks (DQN): Combining deep neural networks with Q-Learning enables the handling
    of complex, high-dimensional state spaces and has led to groundbreaking results
    in game playing and robotics. Policy-gradient methods.'
  bio: Jonas Hellgren completed his PhD studies at Chalmers in 2004, where he acquired
    skills in mathematical simulation, optimization, and control theory. Subsequently,
