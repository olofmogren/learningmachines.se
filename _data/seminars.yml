- id: '2025-03-13'
  date: '2025-03-13'
  speaker: Sherrie Wang
  speaker_title: Assistant Professor
  title: Reliable conclusions from remote sensing maps
  affiliation: Assistant Professor, MIT
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-03-13-sherrie-wang.jpg
  abstract: 'Remote sensing maps are used to estimate regression coefficients relating
    environmental variables, such as the effect of conservation zones on deforestation.
    However, the quality of map products varies, and -- because maps are outputs of
    complex machine learning algorithms that take in a variety of remotely sensed
    variables as inputs -- errors are difficult to characterize. Thus, population-level
    estimates from such maps may be biased. We show how a small amount of randomly
    sampled ground truth data can correct for bias in large-scale remote sensing map
    products. Applying our method across multiple remote sensing use cases in regression
    coefficient estimation, we find that it results in estimates that are (1) more
    reliable than using the map product as if it were 100% accurate and (2) have lower
    uncertainty than using only the ground truth and ignoring the map product.


    Paper: https://arxiv.org/abs/2407.13659'
  bio: 'Sherrie Wang’s research uses novel data and computational algorithms to monitor
    our planet and enable sustainable development. Her focus is on improving agricultural
    management and mitigating climate change, especially in low- or middle-income
    regions of the world. To this end, she frequently uses satellite imagery, crowdsourced
    data, LiDAR, and other spatial data. Due to the scarcity of ground truth data
    in these regions and the noisiness of real-world data in general, her methodological
    work is geared toward developing machine learning methods that work well with
    these constraints.


    Prior to MIT, Wang was a Ciriacy-Wantrup Postdoctoral Fellow at UC Berkeley, hosted
    by Solomon Hsiang and the Global Policy Lab. In 2021, she obtained her PhD in
    Computational and Mathematical Engineering from Stanford University, where she
    was advised by David Lobell and benefited from mentors at the Center on Food Security
    and the Environment and the Sustainability and AI Lab.'
  registration_url: extra2
  youtube_id: -o9x_wwg8mQ
  is_cain: true
- id: '2025-03-06'
  date: '2025-03-06'
  speaker: Atakan Aral
  speaker_title: Assistant Professor
  title: Edge AI and IoT-Driven Water Quality Monitoring
  affiliation: Assistant Professor, University of Vienna
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-03-06-atakan-aral.jpg
  abstract: 'The integration of Edge Computing and Artificial Intelligence (i.e.,
    Edge AI) unlocks new possibilities for remote monitoring of water quality across
    diverse environments. This talk will explore the dual aspects of "remote" monitoring:
    (1) collecting water quality data in geographically remote regions with limited
    energy and connectivity and (2) using connected water quality sensors to gain
    real-time insights remotely. By deploying low-power or energy-harvesting sensors
    and learning from data in close proximity to sensors, we can improve efficiency,
    reduce latency, and maintain learning performance in challenging environments
    without reliable communication and energy infrastructures. The presentation will
    showcase two real-world case studies in river pollution source identification
    and monitoring of water distribution systems.'
  bio: Atakan Aral is a tenure-track assistant professor of Information Systems Engineering
    at the Faculty of Computer Science, University of Vienna, Austria. Prior to that,
    he was a tenure-track assistant professor of Distributed Systems at Umeå University,
    Sweden, and a postdoctoral fellow at the Data Science group at TU Wien, Austria.
    His research interests center around optimizing resource utilization and placement
    at the network's edge for data-driven workloads. He received a dual MSc degree
    in Computer Science and Engineering from Politecnico di Milano (2011) and Istanbul
    Technical University (2012), and a PhD in Computer Engineering from Istanbul Technical
    University (2016). Atakan has been granted two EIC Pathfinder CHIST-ERA projects
    in 2021 and 2024 as international coordinator and national PI, respectively, with
