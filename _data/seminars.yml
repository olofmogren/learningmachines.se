- id: '2022-01-20'
  date: '2022-01-20'
  speaker: Jon Nordby
  title: Monitoring noise, machinery and processes using sound and machine learning
  affiliation: Soundsensing
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: 'Many physical events and processes create sound, often in the hearable
    spectrum. This makes sound an interesting source of information about such processes.
    By combining sound sensors with machine learning, these can be tracked and analyzed.
    Here we will discuss how we have applied this combination for several different
    usecases, including: Noise Monitoring of shooting ranges and construction sites,
    Process Monitoring of coffeebean cracking during roasting, and Condition Monitoring
    of equipment such as pumps and ventilation. We will discuss some of the techniques
    in use, such as Convolutional and Recurrent Neural Networks, spectrogram pre-processing,
    and edge computing on embedded devices and microcontrollers. We will also discuss
    some of the challenges that come when deploying continious monitoring, such as
    data collection, heavily imbalanced data and preserving privacy.'
  bio: Jon is a Machine Learning Engineer that specializes in audio and IoT applications.
    He has a Master in Data Science and a Bachelor in Electronics Engineering, and
    has worked as a software engineer in electronics and web projects for 10 years.
    Since 2019 he is the Head of Machine Learning and Data Science at Soundsensing,
    a provider of IoT sensors for sound with built Machine Learning capabilities.
  is_cain: false
- id: '2022-01-13'
  date: '2022-01-13'
  speaker: Andrew Jesson
  title: Head in the clouds? Why decision making is hard.
  affiliation: OATML, Oxford Applied and Theoretical Machine Learning Group
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-01-13-andrew-jesson.jpg
  abstract: 'How will a patient''s health be affected by taking a given medication?
    How will a user''s question be answered by a google search result? How will cloud
    reflectively and precipitation be influenced by a local emissions policy? Making
    effective decisions depends on being able to answer such questions. Answering
    such questions requires knowledge about the causal effect that a decision (medication,
    search result, emissions policy) has in a specific context. And knowing the effect
    of the decision requires knowledge about the context. In this talk, I will review
    recent collaborative works that aim to: 1) quantify our uncertainties about decision
    outcomes at the individual/unit, group, or population level [JMSG2020, JMGS2021];
    2) understand decision making under such uncertainty [JMGS2021]; and 3) how we
    can learn more about the world in order to reduce our uncertainty [JTvAKSG2021].
    I will also discuss recent applied work looking at using causal models to understand
    Aerosol-Cloud Interactions [JMDDGS2021].'
  bio: Andrew is a DPhil student in the Department of Computer Science at the University
    of Oxford. He works in the Applied and Theoretical Machine Learning Group (OATML)
    under the supervision of Yarin Gal. Prior to joining the group, he was a program
    manager and researcher at  Imagia in Montreal. He obtained his undergraduate and
    master’s degrees from the Department of Electrical and Computer Engineering at
    McGill University, working in the Probabilistic Vision Group (PVG) under the supervision
    of Tal Arbel. His research focuses on personalized decision making under uncertainty
    in causal-effect estimates. Specifically, he is interested in quantifying, integrating,
    and reducing uncertainty arising from the relaxation of causal assumptions.
  youtube_id: M5AeT1cuTZo
  is_cain: false
- id: '2021-12-16'
  date: '2021-12-16'
  speaker: Stephane D'ascoli
  title: 'Double descent : insights from the random feature model'
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: 'In this talk I will present various insights on the double descent curve
    obtained by considering a solvable model for deep learning: the random feature
    model. First, I will present a fine-grained bias-variance decomposition and show
    how the double descent curve can be reconciled with the traditional bias-variance
    tradeoff. Then, I will show that two different kinds of overfitting, which are
    often conflated, can give rise to a “double descent” curve, and can actually occur
    simultaneously, leading to a triple descent curve. Finally, I will extend some
    of these findings to classification tasks on structured data, showing the impact
    of the loss function and the role of low-dimensional structures.'
  bio: I’m a Ph.D. student working on deep learning, jointly supervised by Giulio
    Biroli (ENS Paris) and Levent Sagun (FAIR Paris). My research focuses on understanding
    how deep neural networks are able to generalize despite being heavily overparametrized.
    On one hand, I use tools from statistical mechanics to study simple models, and
    try to understand when and why they overfit. On the other hand, I investigate
    how different types of inductive biases affect learning, from fully-connected
    networks to convolutional networks to transformers.
  youtube_id: QzwW0l6ZUu8
  is_cain: false
- id: '2021-12-09'
  date: '2021-12-09'
  speaker: Arman Rahbar
  title: Online Learning of Decision Trees
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: In this talk, I am going to talk about the problem of learning a decision
    tree online from streaming data. We will focus on two different methods to tackle
    this problem. The first one is called VFDT (Very Fast Decision Tree learner) which
    employs Heoffding bound to guarantee that the resulting tree is asymptotically
    nearly identical to that of a batch decision tree learner. One important limitation
    of VFDT is that it assumes all feature values of data points are always available.
    To address this limitation, I will present a new formulation of the problem which
    enables us to use posterior sampling to learn efficiently from data.
  bio: Arman Rahbar is a WASP Ph.D. student at Chalmers University of Technology and
    is working under the supervision of Prof. Morteza Chehreghani. He received his
    bachelor's and master's degrees in Computer Engineering from Sharif University
    of Technology and Tehran Polytechnic, respectively. Arman's research is mainly
    focused on representation learning problems that need to deal with the lack of
    sufficient available information.
  is_cain: false
- id: '2021-12-02'
  date: '2021-12-02'
  speaker: Ebba Ekblom
  title: Federated learning
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: 'The training of Machine Learning models often requires vast amounts of
    data, which traditionally has been stored at a central server to train a single
    model. Today, data is generally abundant, but due to privacy concerns it can be
    hard to gather it centrally. Thus, Federated Learning was proposed in 2016 as
    a training procedure that aims to benefit from aggregating models trained on many
    private local datasets, without the need to share the actual data. ,,,,time,

    ,,,,time,

    In this presentation I will talk about Federated Learning, and in particular when
    it is applied to the training of Generative Adversarial Networks (GANs). GANs
    are generative models that were first introduced in 2014 and have since then shown
    to have great capacity to generate realistic data. However, as for many other
    machine learning techniques, they require large amounts of data, and training
    can often be unstable leading to issues such as mode collapse. How to adapt these
    models for federated learning is an ongoing research topic, and this presentation
    will be an overview of where the field is at today, the existing challenges and
    what interesting future research directions might be.'
  bio: Ebba is a junior researcher at RISE, where she has been working on Federated
    Learning for Generative Adversarial Networks since 2021. She has a MSc in Engineering
    Mathematics from Chalmers University of Technology and her master's thesis focused
    on generative modelling of microwave data for stroke detection.
  youtube_id: 2GCIjkqiorw
  is_cain: false
- id: '2021-11-25'
  date: '2021-11-25'
  speaker: Maria Priisalu
  title: Semantically Reasoning Pedestrian Models in Generative Autonomous Vehicle
    Testing.
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2021-11-25-maria-priisalu.jpg
  abstract: There exist several datasets for developing self-driving car methodologies.
    Manually collected datasets impose inherent limitations on the variability of
    test cases and it is particularly difficult to acquire challenging scenarios,
    e.g. ones involving collisions with pedestrians. A way to alleviate this is to
    consider automatic generation of safety-critical scenarios for autonomous vehicle
    (AV) testing. However, there is a gap between state of the art pedestrian motion
    models and the pedestrian models used to generate safety-critical scenarios for
    AV testing. Previous approaches for scenario generation use heuristic pedestrian
    behavior models, which limits the realism of the induced test scenarios. In this
    talk I will describe a framework for AV testing, which is not limited to using
    heuristic pedestrian models. This framework is described in detail in our recent
    paper Generating Scenarios with Diverse Pedestrian Behaviors for Autonomous Vehicle
    Testing, presented at CoRL 2021. More specifically, this talk consists of two
    parts. In the first part I will provide an overview of recent pedestrian forecasting
    models. I then present our recently proposed Semantic Pedestrian Locomotion model
    that learns to forecast pedestrian motion conditioned on the scene semantics (described
    in more detail in our ACCV 2020 paper Semantic Synthesis of Pedestrian Locomotion).
    In the second part, I will begin by giving an overview of existing AV testing
    methods, which is followed by a presentation of our recently proposed method for
    AV test case generation that utilizes state of the art pedestrian motion models
    (presented at CoRL 2021).
  bio: Maria Priisalu is a PhD Student in the Computational Imaging Group at Lund
    University since 2016. She is interested in deep and reinforcement learning with
    applications to visual problems. Her research focuses on visually reasoning pedestrian
    models in applications to autonomous vehicles. Prior to her PhD studies Maria
    obtained her MSc. degree at Lund University in Computer Science. During her MSc
    studies she attended an internship at the CERN, a fellowship at CalTech, and exchange
    studies at Georgia Institute of Technology and Zhejiang University.
