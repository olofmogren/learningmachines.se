- id: '2024-11-21'
  date: '2024-11-21'
  speaker: Adjunct Professor Alp Kucukelbir
  title: Artificial Intelligence for Climate Change Mitigation
  affiliation: Columbia University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2024-11-21-alp-kucukelbir.jpg
  abstract: "Artificial intelligence (AI) has the potential to make very significant\
    \ contributions to climate change mitigation. The complexity and scale of the\
    \ challenge is broad. In this talk, I break down opportunities for AI to effect\
    \ incremental and transformational change across multiple sectors, focusing on\
    \ industries with large carbon footprints.\n\nI highlight barriers and risks to\
    \ the adoption of AI, including the carbon footprint of AI usage worldwide. I\
    \ focus on the multiple definitions (and ultimate importance) of \"trust in AI\"\
    \ and its impact on the integration of AI into complex workflows. \n\nThis talk\
    \ is for AI practitioners looking to understand how AI fits into the bigger picture\
    \ of climate change. I highlight opportunities and challenges in each sector that\
    \ I hope will motivate collaboration across academia and industry."
  bio: Alp is chief scientist at Fero Labs (factory optimization software for industrial
