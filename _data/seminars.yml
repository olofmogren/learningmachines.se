- id: '2026-10-22'
  date: '2026-10-22'
  speaker: Luca Ciampi
  speaker_title: Post doc
  title: 'How machines count: Visual object counting from limited supervision to the
    open world'
  affiliation: Post doc, ISTI-CNR
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2026-10-22-luca-ciampi.jpg
  abstract: 'Counting objects in images and videos is a deceptively simple task. Modern
    deep-learning approaches can achieve impressive accuracy, yet they often rely
    on large, carefully annotated datasets and struggle with new environments, unseen
    camera viewpoints, or previously unseen object categories. Even recent vision-language
    models, despite their broad recognition capabilities, remain unreliable at counting,
    particularly in crowded scenes. This seminar examines visual object counting when
    annotated data are scarce or costly, labels vary across annotators, or supervision
    is unavailable for new domains or object categories.


    The talk will begin with class-specific counting in images and videos, showing
    how synthetic data can reduce annotation costs and how unsupervised domain adaptation
    can bridge the gap between training and deployment conditions. It will then turn
    to settings in which annotations are available but uncertain or inconsistent.
    Using biological structure counting as a case study, it will examine how disagreement
    among multiple human raters can be modeled rather than collapsed into a single
    consensus ground truth. The final part will focus on class-agnostic counting,
    where the target object class is specified at inference time through visual exemplars
    or natural-language prompts. For exemplar-based counting, the talk will explore
    how self-supervised visual representations can support training-free methods without
    annotated training data. For text-guided counting, it will examine the use of
    vision-language models and the limitations of current evaluation protocols. Conventional
    counting metrics can conceal failures of semantic grounding: a low counting error
    does not necessarily mean that a model has understood which objects the prompt
    refers to.


    Across applications ranging from traffic and crowd monitoring to biomedical imaging,
    the seminar will highlight how different forms of limited supervision call for
    different solutions, and will discuss the remaining challenges in building counting
    systems that are scalable, semantically grounded, and reliable in the open world.'
  bio: Dr Luca Ciampi is a researcher in the Artificial Intelligence for Media and
    Humanities Laboratory at ISTI-CNR in Pisa. He received his PhD in Information
    Engineering from the University of Pisa, with a thesis on deep-learning techniques
    for visual counting. His research explores visual and multimedia understanding
    when labelled data are scarce, noisy, or costly to obtain. His main focus is object
    counting and localisation in images and videos, spanning domain adaptation, synthetic
    data, multi-rater learning, and class-agnostic approaches. He also works on biomedical
    imaging and bio-inspired learning, including biological neural cultures as computational
    reservoirs. His work has received two paper awards; he was named a Key Innovator
    by the European Commission, and his MSCA proposal received a Seal of Excellence.
  is_cain: false
- id: '2026-10-08'
  date: '2026-10-08'
  speaker: Rangel Daroya
  speaker_title: PhD candidate
  title: Machine perception for scientific measurement from satellite imagery
  affiliation: PhD candidate, University of Massachusetts Amherst
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2026-10-08-rangel-daroya.jpg
  abstract: 'In many scientific domains, the goal is not simply to classify an image
    or produce a visually plausible segmentation, but to estimate quantities that
    scientists and decision-makers can use: river width, water extent, sediment concentration,
    habitat change, or other physical variables. These tasks require models that are
    robust to distribution shift, efficient under limited supervision, and reliable
    enough to support downstream measurement. In this talk, I will discuss machine
    learning and computer vision methods for this setting, with a focus on geospatial
    imagery and hydrology.


    Scientific domains such as remote sensing expose several fundamental limitations
    of current vision systems. Models must operate across sensors, geographic regions,
    seasons, and acquisition conditions, often with limited labeled data and multispectral
    inputs that differ from standard natural image benchmarks. They must also detect
    small or thin structures, handle temporal variation, and avoid errors that may
    appear minor under conventional vision metrics but lead to substantial errors
    in scientific measurements.


    I will discuss three aspects that try to solve these problems: learning transferable
    representations that can adapt across tasks and datasets, developing data-efficient
    perception methods for multispectral and geospatial imagery, and translating model
    predictions into reliable physical measurements. I will highlight work on task
    transfer, satellite representation learning, river segmentation, and downstream
    estimation of river width and other hydrological variables. More broadly, this
    work aims to develop robust, transferable, and data-efficient machine perception
    systems that can turn large-scale satellite and scientific imagery into reliable
    measurements of the physical world.'
  bio: Rangel Daroya is a PhD student in Computer Science at the University of Massachusetts
    Amherst, where she works in the Computer Vision Lab with Prof. Subhransu Maji.
    Her research focuses on computer vision and machine learning, particularly transfer
    and multi-task learning and applications to environmental remote sensing. Her
    recent work includes RiverScope, a high-resolution river segmentation dataset,
    and WildSAT, which learns satellite representations from wildlife observations.
    Rangel received the 2025 AGU Remote Sensing Student Award for RiverScope and passed
    her PhD Portfolio with Distinction. Her work has appeared at CVPR, ICCV, WACV,
    AAAI, and IEEE JSTARS, including a CVPR 2024 Highlight paper.
