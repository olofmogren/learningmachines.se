    the Siebel Scholarship, the U.S. Department of Energy Computational Science Graduate
    Fellowship, and best paper awards at ICML (honorable mention), ACM e-Energy (runner-up),
    PECI, the Duke Energy Data Analytics Symposium, and the NeurIPS workshop on AI
    for Social Good.
