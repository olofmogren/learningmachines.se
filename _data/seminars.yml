    sustainable energy systems. She co-founded AfriClimate AI, a non-profit tackling
    Africa’s climate challenges with AI solutions, while contributing to responsible
    AI development through research on Large Language Models. With over a decade of
    leadership experience in community building and international development, Amal
    is also an award-winning entrepreneur dedicated to transforming research into
    impactful real-world solutions.
