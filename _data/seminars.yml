- id: '2026-02-05'
  date: '2026-02-05'
  speaker: Senior Lecturer Pablo Villanueva Perez
  title: End-to-end AI+physics reconstruction frameworks for X-ray imaging
  affiliation: Lund University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2026-02-05-pablo-villanueva-perez.jpg
  abstract: 'Artificial Intelligence, and particularly deep learning, is transforming
    X-ray imaging by enabling fast, accurate analysis of massive datasets and uncovering
    complex correlations. At high-brilliance sources such as MAX IV, physics-informed
    deep learning offers the possibility to address long-standing reconstruction challenges
    without relying on traditional supervised learning or paired datasets.


    In this talk, we present end-to-end frameworks that merge state-of-the-art AI
    with fundamental physics, i.e., modeling X-ray interactions, propagation, image
    formation, and dynamic processes. Specifically, we will discuss solutions for
    (i) phase retrieval under coherent illumination, (ii) 3D and 4D reconstructions
    from sparse spatiotemporal data, and (iii) efficient data analysis pipelines.
    These approaches demonstrate how integrating physics and AI enables high-speed,
    high-fidelity imaging, opening new frontiers in fields such as materials science
    and biology for academic and industrial applications.'
  bio: Pablo Villanueva-Perez is an Associate Professor in Synchrotron Radiation Research
    at Lund University’s Department of Physics. He earned his PhD in theoretical physics
    in 2013 from the University of Valencia within the BaBar Collaboration at SLAC.
    Transitioning to X-ray imaging, he completed postdoctoral research at the Paul
    Scherrer Institute (TOMCAT group) and CFEL at DESY (Coherent X-ray Imaging group).
    Since joining Lund University in 2019, his work has focused on developing advanced
    X-ray techniques for 3D and 4D imaging across scales from micro to nano and timescales
    from seconds to femtoseconds. He frequently uses synchrotron and XFEL facilities
    for his research.
  is_cain: false
- id: '2026-01-22'
  date: '2026-01-22'
  speaker: Postdoctoral researcher Nita Mulliqi
  title: Towards clinically reliable artificial intelligence for prostate cancer pathology
  affiliation: Karolinska Institute
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2026-01-22-nita-mulliqi.jpg
  abstract: 'Accurate histopathological assessment of prostate biopsies is essential
    for determining prognosis and guiding patient treatment; however, it remains hindered
    by substantial intra- and inter-observer variability. Although deep learning has
    shown promise in improving diagnostic consistency, real-world deployment is limited
    by persistent challenges: generalising across laboratories, scanners and patient
    populations, as well as, handling clinically complex cases. More recently, large
    pathology foundation models have demonstrated broad capabilities, but their performance
    and practicality in disease-specific tasks such as Gleason grading remain insufficiently
    understood.

    Our work focused on developing clinically reliable AI systems for prostate pathology,
    emphasising generalisability and protocol-driven evaluation. To start, we developed
    tools to access and process proprietary whole-slide formats, enabling large-scale,
    scanner-agnostic training. The central part of the work covers our protocolised
    development and validation of a weakly supervised, end-to-end AI model for prostate
    cancer detection and Gleason grading. Trained and evaluated on ~100,000 digitised
    biopsies from 7,342 patients across 15 laboratories in 11 countries, this represents
    the largest international retrospective validation of its kind. We compared the
    task-specific model with pathology foundation models, assessing performance across
    scanners, patient populations, and clinically challenging scenarios, as well as
    practical considerations such as energy consumption and scalability. Finally,
    part of the work was dedicated to specific clinical applications of our model,
    such as reducing unnecessary immunohistochemistry (IHC) staining. In a sensitivity-prioritised
    evaluation across international cohorts, the model identified all malignant slides
    without false negatives and enabled up to a 44% reduction in IHC use.

    Overall, this work outlines a pathway toward robust, efficient and clinically
    valuable AI tools for prostate pathology, supporting future prospective trials
    and real-world implementation.'
  bio: Nita Mulliqi is a postdoctoral researcher in AI and digital pathology at Karolinska
    Institutet, where she recently completed her PhD focusing on developing generalisable
    and protocol-driven AI systems to support pathologists in diagnosing prostate
    cancer. She has led several international collaborations, including one of the
    largest retrospective validations of AI for prostate pathology. Her work has been
    recognised through awards, invited talks, and media features, and contributes
    to global efforts aimed at improving diagnostic consistency. Nita is also the
    co-founder and lead AI scientist at Clinsight AB, where she works to translate
    research innovations into clinical tools that can meaningfully impact patient
    care.
  youtube_id: kX8bNq0OKkk
  is_cain: false
- id: '2025-12-11'
  date: '2025-12-11'
  speaker: Zhengpeng (Frank) Feng
  speaker_title: PhD Student
  title: 'TESSERA: precomputed FAIR global pixel embeddings for earth representation
    and analysis'
  affiliation: PhD Student, Cambridge
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: 'Petabytes of satellite Earth Observation (EO) data are freely available
    and can address critical global challenges. However, EO data quality is poor due
    to clouds and variable lighting conditions. To address this, practitioners typically
    use compositing, but this critically removes the temporal phenological signal.
    Moreover, supervised machine learning to map composited pixels to task-specific
    classes requires accurately labelled data that are rarely available. We present
    TESSERA, a pixel-oriented foundation model for EO time series that creates 128-dimensional
    latent embeddings requiring only a few labels for task-specific training to achieve
    state-of-the-art performance across diverse complex tasks. TESSERA uses two encoders
    that combine optical data with synthetic aperture radar backscatter coefficients
    at 10m resolution, creating embeddings fused with a multilayer perceptron to generate
    annual global embedding maps. TESSERA closely matches or outperforms state-of-the-art
    task-specific models and other foundation models across five diverse downstream
    tasks. It is unprecedented in ease of use, scale, and accuracy: no other open
    foundation model provides precomputed outputs with global, annual coverage at
    10m resolution.'
  bio: Frank Feng is a second-year Ph.D. student in the Department of Computer Science
    and Technology at the University of Cambridge. His research interests lie at the
    intersection of machine learning and earth sciences, with a particular focus on
    developing self-supervised learning algorithms in remote sensing.
