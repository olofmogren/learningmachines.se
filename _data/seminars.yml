- id: '2022-09-22'
  date: '2022-09-22'
  speaker: Devis Tuia
  speaker_title: Professor
  title: Machine learning supporting ecology supporting machine learning
  affiliation: Professor, Ecole Polytechnique Fédérale de Lausanne (EPFL)
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-09-22-devis-tuia.jpg
  abstract: We live an age full of data. In all areas of society, digital data is
    now abundant, but also unstructured and pretty much unexploited. Animal ecology
    is no exception and the lat years have seen an increase of use of digital sensing
    to observe an undestand the animal realm. In this talk, I will present some success
    stories at the interface of machine learning and conservation, where camera traps
    and drone data were used to support censing, population estimation and general
    understanding of animal behavior. I will then sketch a number of points of synergetic
    action necessary to strengthen such interface, a necessary step to jointly tackling
    the biodiversity crisis.
  bio: Devis completed his PhD at University of Lausanne, Switzerland, where he studied
