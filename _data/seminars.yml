- id: '2022-09-15'
  date: '2022-09-15'
  speaker: Martin Hellkvist
  speaker_title: PhD candidate
  title: 'Fake it until you make it: Fake features can improve estimation performance'
  affiliation: PhD candidate, Uppsala University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-09-15-martin-hellkvist.jpg
  abstract: We consider the estimation problem under model misspecification where
    there is a model mismatch between the underlying system, which generates the data, and
    the model used during estimation. We propose a model misspecification framework
    which enables a joint treatment of the model misspecification types of having
    fake features as well as incorrect covariance assumptions on the unknowns and
    the noise. Here,  fake features are features which are included in the model but
    are not present in the underlying system. Under this framework, we characterize
    the estimation performance and reveal trade-offs between the number of samples, number
    of fake features, and the possibly incorrect noise level assumption. We also present
    a decomposition of the output error into components that relate to the respective
    subsets of the model parameters. In contrast to existing work focusing on incorrect
    covariance assumptions or missing features, fake features is a central component
    of our framework. Our results show that fake features can significantly improve
    the estimation performance, even though they are not correlated with the features
    in the underlying system. In particular,  we show that the estimation error can
    be decreased by including more fake features in the model, even to the point where
    the model is overparametrized, i.e., the model contains more unknowns than observations.
  bio: Martin Hellkvist is a PhD student at the Division of Signals and Systems, Department
    of Electrical Engineering at Uppsala University. He received his Master of Science
    degree in Electrical Engineering from Uppsala University in 2018. His main research
    interests are signal processing and machine learning with overparameterized models,
    and my latest publications include topics such as distributed learning and double
    descent.
