- id: '2023-04-20'
  date: '2023-04-20'
  speaker: Rico Sennrich
  speaker_title: Professor
  title: 'Knowledge Transfer Across Languages and Modalities: Insights from Speech
    Translation and Sign Language Translation'
  affiliation: Professor, University of Zurich
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-04-20-rico-sennrich.jpg
  abstract: Large multilingual models have revolutionized natural language processing
    by unlocking knowledge sharing across tasks and languages. For modalities other
    than text, such as audio, images, or video, neural architectures commonly used
    for text have also proven effective, but the beneficial sharing of representations
    across modalities remains a challenge. In this talk, will discuss recent successes
    (and failures) for the multimodal tasks of speech translation and sign language
    translation. Both tasks being very low-resourced, what lessons from low-resource
    text translation can be applied to these multimodal tasks? What unique solutions
    are required to address the audio and video modality? To what extent is information
    shared across modalities in multi-task multimodal systems?
  bio: Rico Sennrich (PhD 2013, University of Zurich) is an SNSF Professor at the
    University of Zurich. He is Honorary Fellow at the University of Edinburgh, and
    an ELLIS Fellow. He is action editor for Computational Linguistics and ACL Rolling
    Review, and standing reviewer for TACL. He regularly serves as area chair at main
    conferences in the field, most recently as senior area chair for ACL 2022 and
    EACL 2023. His research focuses on machine learning for natural language processing,
    specifically high-quality machine translation, transfer learning, and multilingual
    and multimodal models.
  is_cain: false
- id: '2023-04-13'
  date: '2023-04-13'
  speaker: Elijah Cole
  speaker_title: PhD Candidate
  title: Learning from real-world data
  affiliation: PhD Candidate, Caltech
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-04-13-elijah-cole.jpg
  abstract: Humans are collecting vast amounts of data to tackle societal challenges
    like preserving biodiversity, improving healthcare outcomes, and accelerating
    scientific discovery. However, in many domains we are collecting far too much
    data to analyze manually. To meet these challenges, we need machine learning algorithms
    that can automatically extract knowledge from this growing influx of raw data.
    Unfortunately, many machine learning algorithms are not compatible with the limited,
    noisy, and weak supervision often found in real-world settings. This talk focuses
    on the task of learning from real-world data. I will present progress on the problem
    of learning from minimal labels in contexts like multi-label image classification
    and self-supervised representation learning. I will also describe how we can leverage
    small amounts of domain context to improve machine learning algorithms in a modular
    and flexible way, with examples from image classification and object localization.
    Finally, I will show how studying real-world data opens new frontiers in machine
    learning research and provides greater opportunities for impact in important application
    domains.
  bio: Elijah Cole (https://elijahcole.me/) is a Ph.D. candidate in the Computing
    and Mathematical Sciences department at Caltech, advised by Pietro Perona. He
    received a B.S.E. from Duke University in 2017 with a double major in electrical
    engineering and mathematics. During his Ph.D. he completed internships at Google
    Research, Microsoft AI for Earth, and the Air Force Research Laboratory. His research
    focuses on deep learning and computer vision, with an emphasis on learning from
    limited, noisy, and weak supervision. He works with ecologists, physicians, and
    other domain experts to develop new benchmarks that test algorithms under realistic
    conditions and challenge traditional machine learning paradigms. Elijah’s work
    is funded by an NSF Graduate Research Fellowship and the Resnick Sustainability
    Institute.
  youtube_id: m7gNSRFpVZM
  is_cain: false
- id: '2023-03-23'
  date: '2023-03-23'
  speaker: Gabrielle Flood
  speaker_title: Post doc
  title: Matching and Merging of Structure from Motion Maps with Statistical Deformations
  affiliation: Post doc, Lund University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-03-23-gabrielle-flood.jpg
  abstract: 'With the fast development of autonomous vehicles and agents that move
    in the world without human supervision, the need for good localisation methods
    is high. However, the agent cannot determine its position without having something
    to relate to, hence, there is also an increased demand for accurate 3D maps. An
    important issue connected to this is how to match and merge individual local maps
    into one global map.,

    ,

    In this talk we will discuss how to do efficient, flexible and robust map matching
    and merging. We mainly focus on maps created from image data, but the methods
    are applicable to sparse 3D maps coming from different sensor modalities. Merging
    of maps can be advantageous if there are several map representations of the same
    environment, e.g. in collaborative SLAM, or if there is a need for adding new
    information to an already existing map. We will look at ways to do this which
    utilises a compact approximation of the residuals and still allows for deformations
    in the original maps.'
  bio: Gabrielle Flood is a postdoctoral researcher at the Division for Computer Vision
    and Machine Learning at the Centre for Mathematical Sciences, Lund University,
    where she also defended her Ph.D. in applied mathematics in 2021. The topic of
    her thesis was “Mapping and Merging Using Sound and Vision - Automatic Calibration
    and Map Fusion with Statistical Deformations”. Prior to this, she received a M.Sc.
    in applied mathematics in 2016, also from the Faculty of Engineering at Lund University.
    Gabrielles research interests concern image analysis in general and geometric
    problems in computer vision in particular. Currently, her research is mainly focusing
    on positioning and robust estimation of 3D reconstructions from different sensor
    modalities - such as images and audio - and efficient merging of such reconstructions.
  youtube_id: 1iFiM79smCg
  is_cain: false
- id: '2023-03-16'
  date: '2023-03-16'
  speaker: Stefanos Georganos
  speaker_title: Associate Professor
  title: 'Filling the gaps: AI and Earth Observation in support of urban sustainability
    in the Global South'
  affiliation: Associate Professor, Karlstad University/KTH
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-03-16-stefanos-georganos.jpg
  abstract: The Global South includes some of the of the most rapid-growing urban
    regions in the world. This ongoing shift has dramatically affected their capacity
    to provide essential services for their residents, such as durable housing, employment
    and healthcare accessibility. On the contrary, the proliferation of deprived urban
    areas, further marginalizing the urban poor has been an undisputed observation
    of the last years. It is therefore profound, that efforts to improve the quality
    of life of urban dwellers are needed. A starting point to do so, it to provide
    relevant authorities, stakeholders and organizations with useful socioeconomic,
    demographic and health indicators of the urban dwellers. Nonetheless, in large
    parts of the Global South, this type of critical information is at best scarce
    and at worst non-existent and certainly not suited for sophisticated analyses.
    In this talk, the potential and challenges of harnessing the power of AI and Earth
    Observation tools and data to fill these data gaps are discussed. Various examples
    pertinent to poverty, population estimation, epidemiology and land use are demonstrated,
    and a vision on future directions is unraveled.
  bio: Stefanos is an Associate Professor in Geomatics at Karlstad University and
    a researcher with KTH, Royal Institute of Technology.  He does research in quantitative
    human geography, remote sensing, spatial epidemiology, demography and machine
    learning. He is particularly interested in the use of geo-information for helping
    address the UN Sustainable Development Goals, with a geographical interest in
    sub-Saharan African cities. His latest research unravels the potential of machine
    and deep learnning and Earth Observation to detect, measure and characterize socio-economic
    inequalities in deprived urban areas in support of the most vulnerable populations.
    Stefanos is the co-Chair of the European's Assosciation of Remote Sensing Laboratories
    Special Interest Group on Developing Countries. He has coordinated and managed
    large international consortia such as REACT (https://react.ulb.be/).
  youtube_id: cH3Lc5MettA
  is_cain: false
- id: '2023-03-09'
  date: '2023-03-09'
  speaker: Reader Shay Cohen
  title: Summarization with Latent Structure, Context Factors and Quantitative Precision
  affiliation: University of Edinburgh
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-03-09-shay-cohen.jpg
  abstract: Large language models (LLMs) have demonstrated remarkable results in NLP,
    achieving significant progress in many tasks, including document summarization.
    I will show through three avenues how we can support LLMs to provide summaries
    that better suit user needs. I will first show how latent structure can improve
    the summaries when we require synthesis of different parts of the input document
    to achieve a reasonable summary. I will then show how we can consider context
    factors when summarizing, as they are often latent but significantly affect the
    desired outcome. I will continue by showing that "verifier models" can mitigate
    the well-known problem of imprecision with generated text, focusing on the accuracy
    of specifying quantitative information. I will conclude with thoughts about where
    we are going with LLMs, and what we can do better.
  bio: Shay Cohen is a Reader at the University of Edinburgh (School of Informatics).
    Before this, he was a postdoctoral research scientist in the Department of Computer
    Science at Columbia University and held an NSF/CRA Computing Innovation Fellowship.
    He received his B.Sc. and M.Sc. from Tel Aviv University in 2000 and 2004 and
    his Ph.D. from Carnegie Mellon University in 2011. His research interests span
    a range of topics in NLP and machine learning, with a focus on structured prediction
    (for example, parsing) and text generation.
  youtube_id: IhVMG9Flu2M
  is_cain: false
- id: '2023-02-23'
  date: '2023-02-23'
  speaker: Alexander Ilin
  speaker_title: Professor
  title: Hierarchical Imitation Learning with Vector Quantized Models
  affiliation: Professor, Aalto University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-02-23-alexander-ilin.jpg
  abstract: The ability to plan actions on multiple levels of abstraction enables
    intelligent agents to solve complex tasks effectively. However, learning the models
    for both low and high-level planning from demonstrations has proven challenging,
    especially with higher-dimensional inputs. To address this problem, we propose
    to use reinforcement learning to identify subgoals in expert trajectories by associating
    the magnitude of the rewards with the predictability of low-level actions given
    the state and the chosen subgoal. We build a vector-quantized generative model
    for the identified subgoals to perform subgoal-level planning. In experiments,
    the algorithm excels at solving complex, long-horizon decision-making problems
    outperforming state-of-the-art. Because of its ability to plan, our algorithm
    can find better trajectories than the ones in the training set.
  bio: Alexander Ilin is a Professor of Practice in the Department of Computer Science
    of Aalto University. He was a research scientist at Curious AI, Amazon and Analyse2.
    He obtained his PhD degree from Helsinki University of Technology under the supervision
    of Prof. Erkki Oja and Dr. Harri Valpola. His research interests focus on deep
    representation learning and model-based reinforcement learning.
  youtube_id: mP4TabA9vaY
  is_cain: false
- id: '2023-02-09'
  date: '2023-02-09'
  speaker: Senior Researchers Joakim Nivre, Erik Ylipää, and Olof Mogren
  title: ChatGPT and other large language models (LLMs)
  affiliation: RISE Research Institutes of Sweden
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-02-09-joakim-nivre,-erik-ylipaa,-and-olof-mogren.jpg
  abstract: 'Chat GPT has been the AI-talk-of-the-town in 2022. It has demonstrated
    an impressive fluency, and produced examples of dialog that far surpass the state-of-the-art
    in language models trained for dialog. The system was presented by OpenAI in late
    November 2022, and in contrast to other recent releases from them, this one was
    not accompanied by a research paper. In this seminar, we will have a presentation
    where Olof Mogren goes through what we know about the technology behind Chat GPT.
    We will then try a new format for Learning Machines: after the introduction, we
    will have a panel discussion with Joakim Nivre and Erik Ylipää, discussing some
    of the aspects of Chat GPT and other large language models. How do they work and
    how are they trained? How have they affected AI and NLP research? What will be
    the effects in the future? Finally, we will open the floor to questions and discussions
    from and with the audience.'
  bio: Joakim Nivre is a research leader in natural language processing at RISE Research
    Institutes of Sweden, and professor of computational linguistics at Uppsala University.
    Erik Ylipää is a researcher at RISE with extensive expertise in transformer-based
    models. Olof Mogren is a research leader within applied artificial intelligence
    and deep learning at RISE.
  is_cain: false
- id: '2023-02-02'
  date: '2023-02-02'
  speaker: Vincent Szolnoky
  speaker_title: PhD Candidate
  title: On the Interpretability of Regularisation for Neural Networks Through Model
    Gradient Similarity
  affiliation: PhD Candidate, Chalmers University of Technology
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-02-02-vincent-szolnoky.jpg
  abstract: Most complex machine learning and modelling techniques are prone to over-ﬁtting
    and may subsequently generalise poorly to future data. Artiﬁcial neural networks
    are no different in this regard and, despite having a level of implicit regularisation
    when trained with gradient descent, often require the aid of explicit regularisers.
    In this talk, a new framework named Model Gradient Similarity (MGS) shall be introduced,
    that (1) serves as a metric of regularisation, which can be used to monitor neural
    network training, (2) adds insight into how explicit regularisers, while derived
    from widely different principles, operate via the same mechanism underneath by
    increasing MGS, and (3) provides the basis for a new regularisation scheme which
    exhibits excellent performance, especially in challenging settings such as high
    levels of label noise or limited sample sizes.
  bio: Vincent Szolnoky is an industrial PhD student at Chalmers University of Technology
    and Centiro. His research is centered around training and regularisation of Neural
    Networks. Most recently, Vincent's paper on Model Gradient Similarity and its
    connection to regularisation for Neural Networks was accepted to NeurIPS 2022,
    one of the largest machine learning conferences, where it was well received and
    garnered much attention.
  youtube_id: o5E1Z_i943A
  is_cain: false
- id: '2023-01-26'
  date: '2023-01-26'
  speaker: Research Scientist Lena Voita
  title: 'A Journey on Interpretability Methods in NLP: Inside-Out and Back'
  affiliation: FAIR
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-01-26-lena-voita.jpg
  abstract: 'In this talk, I will illustrate several approaches, motivations and ideas
    behind analysis of NLP models. As an example, we will take the standard Transformer
    model trained for the Machine Translation task and will look at it from different
    points of view. We will start our journey from examining model components and
    seeing how, and whether, model’s inductive biases facilitate performing the task.
    Next, we turn to the kinds of information the model relies on to make its predictions.
    Here we will use attribution methods and will see how some potentially pathological
    behaviours look on the inside. Finally, we will turn our view inside-out, i.e.
    from inner workings of the model to analysing its outputs. In this part, we will
    discover that the way the model learns to translate is very similar to how humans
    do it: from learning word-by-word translation first to becoming more fluent later.
    Most importantly, the two views (from the inside and from the outside) show the
    same process, and we will see how this process is reflected in these two types
    of analysis.'
  bio: Elena (Lena) Voita is a Research Scientist at Facebook AI Research (joined
    recently). She is mostly interested in understanding what and how neural models
    learn. Previously, she was a PhD student at the University of Edinburgh supervised
    by Ivan Titov and Rico Sennrich, was awarded Facebook PhD Fellowship, worked as
    a Research Scientist at Yandex Research side by side with the Yandex Translate
    team. She enjoys writing blog posts and teaching; a public version of (a part
    of) her NLP course is available at NLP Course For You.
  youtube_id: gvxMjQ9at28
  is_cain: false
- id: '2023-01-19'
  date: '2023-01-19'
  speaker: Giulia Fanti
  speaker_title: Assistant professor
  title: Reducing the Communication Complexity of Federated Learning through Multistage
    Optimization
  affiliation: Assistant professor, Carnegie Mellon University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-01-19-giulia-fanti.jpg
  abstract: Federated learning (FL) aims to minimize the communication cost of training
    a model over heterogeneous data distributed across many clients. A common approach
    is local update methods, where clients take multiple optimization steps over local
    data before communicating with the server (e.g., FedAvg). When clients’ data is
    homogeneous, local methods converge fast with a small number of communications.
    On the other hand, when clients are highly heterogeneous, global update methods,
    where clients take one optimization step per communication round (e.g., SGD),
    significantly outperform local methods. A fundamental question in FL is how to
    exploit the benefits of both local and global approaches to achieve near-optimal
    convergence rates for all heterogeneity regimes. To this end, we propose a federated
    chaining framework; we first run a local-update method up to a heterogeneity-induced
    error floor and then switch to a global-update method. Federated chaining is the
    first approach to achieve near-optimal convergence rates for strongly convex functions
    and non-convex PL functions. Empirical results support this theoretical gain over
    existing methods.
  bio: Giulia Fanti is an Assistant Professor of Electrical and Computer Engineering
    at Carnegie Mellon University. Her research interests span the security, privacy,
    and efficiency of distributed systems. She is a two-time fellow of the World Economic
    Forum’s Global Future Council on Cybersecurity and a member of NIST’s Information
    Security and Privacy Advisory Board. Her work has been recognized with several
    awards, including best paper awards, a Sloan Fellowship, an Intel Rising Star
    Faculty Award, and a SIGMETRICS Rising Star Award. She obtained her Ph.D. in EECS
    from U.C. Berkeley and her B.S. in ECE from Olin College of Engineering.
  youtube_id: q8Sol6FiBeU
  is_cain: false
- id: '2023-01-12'
  date: '2023-01-12'
  speaker: Mark D. Plumbley
  speaker_title: Professor
  title: AI for Sound
  affiliation: Professor, University of Surrey
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-01-12-mark-d.-plumbley.jpg
  abstract: 'Imagine you are standing on a street corner in a city. Close your eyes:
    what do you hear? Perhaps some cars and busses driving on the road, footsteps
    of people on the pavement, beeps from a pedestrian crossing, and the hubbub of
    talking shoppers. You can do the same in a kitchen as someone is making breakfast,
    or as you are travelling in a vehicle. Now, following the success of AI and machine
    learning technologies for speech and image recognition, we are beginning to build
    computer systems to automatically recognize real- world sound scenes and events.
    In this talk, we will explore some of the work going on in this rapidly expanding
    research area, and discuss some of the potential applications emerging for sound
    recognition, from home security and assisted living to environmental noise and
    sound archives. We will also outline how we are adopting participatory methods,
    such as a virtual world cafe approach, to direct project outcomes from stakeholders,
    and so help us realise the potential benefit of sound sensing to society and the
    economy.'
  bio: Prof. Mark Plumbley is Professor of Signal Processing at the Centre for Vision,
    Speech and Signal Processing (CVSSP) at the University of Surrey, in Guildford,
    UK. He is an expert on analysis and processing of audio, using a wide range of
    signal processing and machine learning methods. He led the first international
    data challenge on Detection and Classification of Acoustic Scenes and Events (DCASE),
    and is a co-editor of the recent book on "Computational Analysis of Sound Scenes
    and Events" (Springer, 2018). He currently holds a 5-year EPSRC Fellowship "AI
    for Sound" on automatic recognition of everyday sounds. He is a Member of the
    IEEE Signal Processing Society Technical Committee on Audio and Acoustic Signal
    Processing, and a Fellow of the IET and IEEE.
  youtube_id: otYyKy5WzZ8
  is_cain: false
- id: '2022-12-08'
  date: '2022-12-08'
  speaker: William Lidberg
  title: Geographical intelligence
  affiliation: Swedish University of Agricultural Sciences
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-12-08-william-lidberg.jpg
  abstract: 'Most of the Nordic countries are covered in forest and there is a long
    history of large-scale forestry in the region. The role of forests in society
    has become more critical with higher demands for energy, raw materials, and ecosystem
    services such as carbon storage, clean water, and recreation. In order to meet
    global sustainability goals and enable social change, there is a great need to
    plan land use with the environment in mind and take into account climate change
    and social values. One of the most important tools for successful sustainable
    forest management is correct and accurate maps as a basis for decision-making.,

    ,

    With satellite maps and Google Maps, it''s easy to think we have all the maps
    we need. In fact, the Swedish terrain is poorly mapped. If you walk in the forest,
    it doesn''t take long until you find a stream, a wetland, or cultural remains
    that are not marked on any maps. However, with the help of airborne laser scans,
    we can now peer through the canopy cover and get a clear view of the forest floor.
    My research focuses on using AI to map the forest landscape but I also ask questions
    about social and ethical challenges that come with the implementation of these
    maps. The Swedish system is built on trust in government agencies. What happens
    with that trust when management decisions are made based on AI-derived maps?'
  bio: William is an assistant professor in the department of forest ecology and sustainable
    management at the Swedish university of agricultural sciences. He is leading an
    interdisciplinary research group that combines soil science, hydrology, remote
    sensing, archaeology, and AI with social science to solve problems in forest management.
    William collaborates with multiple Swedish agencies to quickly take ideas from
    research to implementation on a national scale.
  youtube_id: Ezwgsjh2Oh8
  is_cain: false
- id: '2022-12-01'
  date: '2022-12-01'
  speaker: Sara Beery
  speaker_title: Assistant professor
  title: 'Auto Arborist: Towards Mapping Urban Forests Across North America'
  affiliation: Assistant professor, MIT
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-12-01-sara-beery.jpg
  abstract: 'Generalization to novel domains is a fundamental challenge for computer
    vision. Near-perfect accuracy on benchmarks is common, but these models do not
    work as expected when deployed outside of the training distribution. To build
    computer vision systems that truly solve real-world problems at global scale,
    we need benchmarks that fully capture real-world complexity, including geographic
    domain shift, long-tailed distributions, and data noise. We propose urban forest
    monitoring as an ideal testbed for studying and improving upon these computer
    vision challenges, while working towards filling a crucial environmental and societal
    need. Urban forests provide significant benefits to urban societies. However,
    planning and maintaining these forests is expensive. One particularly costly aspect
    of urban forest management is monitoring the existing trees in a city: e.g., tracking
    tree locations, species, and health. Monitoring efforts are currently based on
    tree censuses built by human experts, costing cities millions of dollars per census
    and thus collected infrequently. Previous investigations into automating urban
    forest monitoring focused on small datasets from single cities, covering only
    common categories . To address these shortcomings, we introduce a new large-scale
    dataset that joins public tree censuses from 23 cities with a large collection
    of street level and aerial imagery. Our Auto Arborist dataset contains over 2.5M
    trees and >300 genera and is >2 orders of magnitude larger than the closest dataset
    in the literature. We introduce baseline results on our dataset across modalities
    as well as metrics for the detailed analysis of generalization with respect to
    geographic distribution shifts, vital for such a system to be deployed at-scale.'
  bio: Sara is an incoming assistant professor at MIT EECS' Faculty of AI and Decision
    Making and CSAIL, and a Visiting Researcher at Google working on Auto Arborist.
    She's always loved the natural world, and has seen a growing need for technology-based
    approaches to conservation and sustainability challenges. Her research focuses
    on building computer vision methods that enable global-scale environmental and
    biodiversity monitoring across data modalities, tackling real-world challenges
    including strong spatiotemporal correlations that lead to domain shift, imperfect
    data quality, fine-grained categories, and long-tailed distributions. Sara received
    my PhD in Computing and Mathematical Sciences (CMS) at Caltech, advised by Pietro
    Perona, where she recieved the Amori Doctoral Prize for my dissertation.
  youtube_id: Ob7XfUPmKu4
  is_cain: false
- id: '2022-11-24'
  date: '2022-11-24'
  speaker: Viktor Larsson
  speaker_title: Associate Professor
  title: Mapping and Localization for AR
  affiliation: Associate Professor, LTH
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-11-24-viktor-larsson.jpg
  abstract: For augmented reality devices to persist content across sessions it is
    necessary to both build maps of the environment and to localize within them. The
    current benchmarks for visual localization are focused on single-image localization.
    However, in the context of AR, more information is usually available, e.g. temporal
    data (image sequences), IMU or radio signals. In this talk I will present our
    recent work on benchmarking localization and mapping in the context of AR. We
    have introduced a new dataset which contain diverse and large-scale scenes recorded
    with head-mounted and hand-held AR devices, together with an accurate ground truth
    obtained via laser scanners. While we used the dataset for benchmarking, we believe
    it can be useful in many other contexts as well.
  bio: Viktor Larsson is an assistant professor in the Mathematical Imaging Group
    at Lund University. He previously worked as a PostDoc and senior researcher at
    the Computer Vision and Geometry group lead by Marc Pollefeys at ETH Zurich. His
    research interests include robust estimation problems that appear in 3D computer
    vision (e.g. Structure-from-Motion, visual localization and SLAM). He is currently
    exploring how to best integrate deep learning with classical geometry-based pipelines.
    In particular, identifying and replacing hand-crafted heuristics or implicit assumptions
    with more data-driven alternatives.
