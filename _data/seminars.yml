- id: '2023-09-14'
  date: '2023-09-14'
  speaker: Virginia Smith
  speaker_title: Associate Professor
  title: Evaluating Large-Scale Learning Systems
  affiliation: Associate Professor, CMU
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-09-14-virginia-smith.jpg
  abstract: To deploy machine learning models in practice it is critical to have a
    way to reliably evaluate their effectiveness. Unfortunately, the scale and complexity
    of modern machine learning systems makes it difficult to provide faithful evaluations
    and gauge performance across potential deployment scenarios. In this talk I discuss
    our work addressing challenges in large-scale ML evaluation. First, I explore
    the problem of evaluating models trained in federated networks of devices, where
    issues of device subsampling, heterogeneity, and privacy can introduce noise in
    the evaluation process and make it challenging to provide reliable evaluations.
    Second, I present ReLM, a system for validating and querying large language models
    (LLMs). Although LLMs have been touted for their ability to generate natural-sounding
    text, there is a growing need to evaluate the behavior of LLMs in light of issues
    such as data memorization, bias, and inappropriate language. ReLM poses LLM validation
    queries as regular expressions to enable faster and more effective LLM evaluation.
  bio: Virginia Smith is an assistant professor in the Machine Learning Department
    at Carnegie Mellon University. Her research spans machine learning, optimization,
    and distributed systems. Virginia’s current work addresses challenges related
    to optimization, privacy, and robustness in distributed settings to enable trustworthy
    federated learning at scale. Virginia’s work has been recognized by an NSF CAREER
    Award, MIT TR35 Innovator Award, Intel Rising Star Award, and faculty awards from
    Google, Apple, and Meta. Prior to CMU, Virginia was a postdoc at Stanford University
    and received a Ph.D. in Computer Science from UC Berkeley.
