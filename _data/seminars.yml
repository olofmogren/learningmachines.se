- id: '2025-02-20'
  date: '2025-02-20'
  speaker: Abdulhakim Abdi
  speaker_title: Researcher
  title: Tech-informed nature conservation - are we there yet?
  affiliation: Researcher, Lund University
  time: 15:00 CET
  location: RISE Lund Office (Scheelevägen 17)
  city: RISE Lund Office (Scheelevägen 17)
  venue_address: RISE Lund Office (Scheelevägen 17)
  photo: /assets/images/speakers/2025-02-20-abdulhakim-abdi.jpg
  abstract: In the face of a global biodiversity crisis, the ability to efficiently
    monitor ecological change across space and time has never been more accessible.
    Advances in satellite remote sensing and AI have opened new frontiers for biodiversity
    monitoring by offering powerful tools to analyze vast datasets, automate species
    detection, and improve disturbance tracking. While these technologies hold great
    promise, their widespread adoption faces key challenges, including data accessibility,
    environmental costs, model interpretability, and the need for stronger interdisciplinary
    collaboration. This presentation explores the opportunities and limitations of
    tech-driven nature conservation, assessing whether current developments are sufficient
    to bridge critical knowledge gaps. The integration of remote sensing with AI brings
    us closer to a more data-informed approach to managing the living world - but
    are we truly ready to harness its full potential?
  bio: I am a geographer and environmental scientist specializing in the interaction
    between natural ecosystems and human activity. My research focuses on leveraging
    remote sensing, machine learning, and spatial analysis to improve biodiversity
    monitoring and conservation efforts. Currently, I am working on mapping tree species
    composition using satellite imagery to enhance forest management strategies. I
    have a PhD in Physical Geography and Ecosystem Science and an MSc in Geospatial
    Technologies. Currently, I am a senior researcher at the Center for Environmental
    and Climate Science, Lund University.
  registration_url: extra2
  youtube_id: Gs3Tcfec6iY
  is_cain: true
- id: '2025-02-06'
  date: '2025-02-06'
  speaker: Benjamin Cretois
  speaker_title: Researcher
  title: 'Leveraging AI for Large-Scale Acoustic Biodiversity Monitoring: Insights
    from TABMON'
  affiliation: Researcher, Norwegian Institute for Nature Research
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-02-06-benjamin-cretois.jpg
  abstract: 'Advancing biodiversity monitoring is crucial for meeting the EU Biodiversity
    Strategy targets and addressing gaps in current ecological assessments. However,
    collecting data to monitor the state of biodiversity is time and resource consuming.
    Passive Acoustic Monitoring (PAM), in combination with AI tools offers an efficient
    alternative to conventional data collection practices. PAM is a non-invasive method
    that uses sound recorders to capture wildlife vocalizations and environmental
    sounds over time. It is particularly valuable for monitoring elusive or nocturnal
    species, such as birds, amphibians, and marine mammals, that are challenging to
    detect visually.


    The "Towards a Transnational Acoustic Biodiversity Monitoring Network" (TABMON)
    project is an initiative to establish a transnational passive acoustic monitoring
    monitoring network using autonomous acoustic sensors across four different European
    countries: Norway, Netherlands, France and Spain. TABMON’s objective is to demonstrate
    how acoustic sensing, coupled with cutting-edge AI, can complement traditional
    monitoring methods and support the development of methods to better monitor biodiversity.


    In this talk, we will also share our experiences with the deployment of acoustic
    recorders, data management strategies, and annotation protocols. These include
    managing large-scale, networked deployments across diverse landscapes, designing
    an efficient annotation workflow, and leveraging AI tools to process and analyze
    massive datasets.'
  bio: Benjamin Cretois is a researcher at the Norwegian Institute for Nature Research
    (NINA), working at the interface of artificial intelligence, statistics, and biodiversity
    conservation. His work primarily focuses on developing deep learning tools to
    better analyze bioacoustic data.
  registration_url: extra2
  is_cain: true
- id: '2025-01-30'
  date: '2025-01-30'
  speaker: Amal Nammouchi
  speaker_title: PhD student
  title: 'Leveraging AI for Climate Resilience in Africa: Challenges, Opportunities,
    and the Need for Collaboration'
  affiliation: PhD student, Karlstad University and AfriClimate AI
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-01-30-amal-nammouchi.jpg
  abstract: As climate change issues become more pressing, their impact in Africa
    calls for urgent, innovative solutions tailored to the continent’s unique challenges.
    While Artificial Intelligence (AI) emerges as a critical and valuable tool for
    climate change adaptation and mitigation, its effectiveness and potential are
    contingent upon overcoming significant challenges such as data scarcity, infrastructure
    gaps, and limited local AI development. This talk explores the role of AI in climate
    change adaptation and mitigation in Africa. It advocates for a collaborative approach
    to build capacity, develop open-source data repositories, and create context-aware,
    robust AI-driven climate solutions that are culturally and contextually relevant.
  bio: Amal Nammouchi is a PhD student at Karlstad University’s SOLVE Research Centre,
