- id: '2025-11-20'
  date: '2025-11-20'
  speaker: Katarzyna Michalowska
  speaker_title: Researcher
  title: Multi-resolution learning with neural operators and long short-term memory
    neural networks
  affiliation: Researcher, SINTEF
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-11-20-katarzyna-michalowska.jpg
  abstract: 'In real-world applications, collecting large amounts of high-resolution
    data is rarely practical. The cost of specialized equipment, time-intensive measurements,
    and expensive high-fidelity simulations often means that high-resolution samples
    are limited. Meanwhile, low-resolution data are far easier to obtain and often
    exist in abundance, creating a common scenario: plentiful coarse data but limited
    fine data. Standard neural networks, which require fixed-resolution inputs, cannot
    exploit this imbalance and typically perform poorly when generalizing across resolutions.


    Deep operator networks, or DeepONets offer a distinct advantage over standard
    neural networks through a property known as discretization invariance, enabling
    learning across varying data resolutions. However, DeepONets alone do not effectively
    capture long-term temporal dependencies, limiting their performance on problems
    involving long time horizons.


    In this talk, we present a framework that addresses both challenges: multi-resolution
    learning and long-time horizon modelling. We achieve this by extending DeepONets
    with long short-term memory networks (LSTMs) and introducing a multi-stage training
    procedure that leverages data at multiple resolutions. This hybrid architecture
    first learns global dynamics from abundant low-resolution data and then fine-tunes
    on limited high-resolution samples, capturing both multi-resolution structure
    and temporal dependencies. In tests on nonlinear dynamical systems, our multi-resolution
    DON-LSTM achieves lower generalization error and requires fewer high-resolution
    samples than standard DeepONet or LSTM models. Our results demonstrate that the
    proposed approach is well-suited for real-world scenarios where high-resolution
    data are limited, highlighting its potential for practical applications across
    science and engineering.'
  bio: Katarzyna Michałowska is a Research Scientist in the Analytics and Artificial
    Intelligence group in the Department of Mathematics and Cybernetics at SINTEF
    Digital, Norway. She holds a Ph.D. in physics-informed machine learning from the
    University of Oslo. Her research focuses on applied machine learning with a focus
    on physics-informed and robust machine learning solutions. The presented work
    is a collaboration between SINTEF and the CRUNCH group at the Division of Applied
    Mathematics at Brown University, USA.
  registration_url: extra2
  youtube_id: mFTFRA5sd3M
  is_cain: true
- id: '2025-11-13'
  date: '2025-11-13'
  speaker: Nora Gourmelon
  speaker_title: PhD Student
  title: Self-supervised pre-training for glacier calving front extraction from synthetic
    aperture radar imagery
  affiliation: PhD Student, Friedrich-Alexander-Universität Erlangen-Nürnberg (FAU)
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-11-13-nora-gourmelon.jpg
  abstract: 'The factors influencing melt at glacier fronts facing the ocean remain
    an active area of research. To better understand these factors, it is essential
    to monitor changes in glacier calving fronts. Due to the importance of weather-dependent
    and seasonal variations, Synthetic Aperture Radar (SAR) is the preferred imaging
    method for such monitoring. In recent years, deep learning models have been developed
    to automate the extraction of calving front positions, however, their performance
    on SAR data remains suboptimal.


    Limited labeled data and high variability in SAR images hinder traditional supervised
    learning. Foundation models pre-trained on large, diverse datasets could provide
    robust feature representations that require minimal labeled data for fine-tuning
    on specific SAR tasks. However, in preliminary experiments, we found that the
    domain gap is too large for the task of extracting calving fronts from SAR imagery,
    and foundation models fine-tuned on the "CAlving Fronts and where to Find thEm"
    (CaFFe) benchmark dataset performed subpar.


    Therefore, we compiled an unlabeled dataset of Sentinel-1 SAR image sequences
    of Arctic glaciers, each associated with a single Sentinel-2 optical reference
    image. Using this dataset, we developed a novel multi-modal self-supervised pre-training
    strategy and applied it to pre-train a hybrid CNN-transformer model. Fine-tuning
    on the CaFFe benchmark showed that the pre-trained model outperforms its non-pre-trained
    counterpart, enabling more robust calving front segmentation and demonstrating
    the potential of data-efficient learning for SAR imagery.'
  bio: Nora Gourmelon is a PhD student at Friedrich Alexander Universität Erlangen
    Nürnberg, specializing in AI for Earth. Her current research focuses on automating
    glacier calving front segmentation in Synthetic Aperture Radar satellite imagery.
    She holds an M.Sc. in computer science with honors, complemented by study abroad
    semesters at NTNU (Norway) and SMU (Canada). She actively contributes to promoting
    wellbeing and equity within her lab, engaging in mental health and gender-equality
    initiatives. Recognized as an AI Newcomer by the German Informatics Society in
    2023, her interdisciplinary research bridges computer vision, remote sensing,
    and cryospheric science.
  registration_url: extra2
  is_cain: true
- id: '2025-11-06'
  date: '2025-11-06'
  speaker: Felix Köhler
  speaker_title: PhD Student
  title: From numerical simulators of PDEs to neural emulators and back
  affiliation: PhD Student, TU Munich
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-11-06-felix-kohler.jpg
  abstract: The potential for computational speedups and tackling unsolved problems
    has motivated the use of neural networks (NNs) for helping solve PDEs. In particular,
    image-like models that operate on state-discrete representations that approach
    time autoregressively gained popularity over the past years. In this talk, I will
    present a holistic perspective on learning autoregressive neural emulators from
    simulated data, starting with the synthetic data generation using classical numerical
    simulators, covering the training process and ultimately investigating their benchmarking.
    Using a wide range of experiments with different PDEs and neural architectures,
    I will highlight the similarities between emulators and simulators. This shows
    how emulator architectures were inspired by classical schemes for solving the
    laws of nature and thereby inherit both their merits and limitations. Moreover,
    I will elaborate on the impact of reference data fidelity and discuss a counterintuitive
    yet interesting finding when emulators can become better than their training data
    source.
  bio: Felix Koehler is a fourth-year PhD student at the Technical University of Munich
    under the supervision of Prof. Nils Thuerey. His research interests span numerical
    simulations of PDEs, reduced-order models, neural emulators, optimization theory,
    automatic differentiation and adjoint methods. In particular, he is interested
    in discovering deep insights on neural networks solving physics problems, e.g.,
    in fluid or structural mechanics. He holds an M.Sc. in Computational Science &
    Engineering from TUM. Besides research, he works on free educational material
    covering Machine Learning & Simulation on his YouTube channel.
  registration_url: extra2
  is_cain: false
- id: '2025-10-16'
  date: '2025-10-16'
  speaker: Postdoctoral researcher Lena Stempfle
  title: Interpretable machine learning for prediction with missing values at test
    time
  affiliation: MIT
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-10-16-lena-stempfle.jpg
  abstract: Missing values are inevitable in real-world healthcare data, yet common
    strategies like imputation or missingness indicators often undermine interpretability.
    In this talk, I present methods for building interpretable models that remain
    reliable under test-time missingness. I will introduce Sharing Pattern Submodels,
    a way to leverage missingness patterns while retaining generalization; MINTY,
    a rule-based model that avoids imputation through logical substitutions; and a
    broader framework that adapts trees, sparse linear models, and ensembles to minimize
    reliance on missing features. Supported by insights from a clinician survey, these
    approaches aim to make machine learning both robust to missingness and transparent
    enough for clinical decision support.
  bio: Lena Stempfle is a postdoctoral associated with MIT healthy ML group led by
    Marzyeh Ghassemi with WASP International Postdoctoral Scholarship. She completed
    her PhD in Computer Science at Chalmers University of Technology in Sweden. Her
    research focuses on the intersection of machine learning and healthcare, with
    a particular interest in predictions with missing values at test time, time series,
    and causality. Lena’s aims to develop interpretable and accurate models to support
    clinical decision-making.
  registration_url: extra2
  youtube_id: s5rn4P-jpTM
  is_cain: false
- id: '2025-10-09'
  date: '2025-10-09'
  speaker: Sebastian Hafner
  speaker_title: Researcher
  title: Earth observation and deep learning for urban applications
  affiliation: Researcher, RISE Research Institutes of Sweden
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2025-10-09-sebastian-hafner.jpg
  abstract: Urbanization is progressing at an unprecedented rate in many places around
    the world, making Earth observation (EO) a vital tool for monitoring its dynamics
    on a global scale. Modern satellite missions provide new opportunities for urban
    mapping and change detection (CD) through high-resolution imagery. At the same
    time, EO data analysis has advanced from traditional machine learning approaches
    to deep learning (DL), particularly Convolutional Neural Networks (ConvNets).
    Yet, current DL methods for urban mapping and CD face key challenges, including
    effectively integrating multi-modal EO data, reducing reliance on large labeled
    datasets, and improving transferability across geographic regions. This talk will
    present methods to address these challenges in urban mapping and CD, with applications
    such as multi-hazard building damage detection. It will also highlight the IDEAMAPS
    Data Ecosystem project, showing how its community-centric approach advances our
    understanding of urban deprivation and enables DL-based deprivation mapping.
  bio: Sebastian Hafner is a Researcher at RISE Research Institutes of Sweden and
    an Affiliate at the University of Glasgow. His work focuses on urbanization and
    its challenges using Earth observation and data science, with an emphasis on deep
    learning. He previously worked as a Research Associate at the Urban Big Data Centre,
    University of Glasgow, developing methods to map deprivation in the Global South.
    Sebastian earned a PhD in Geoinformatics from KTH Royal Institute of Technology
    in 2024, where he studied deep learning for large-scale urban mapping and change
    detection. He holds a Master’s degree (2019) in Remote Sensing and Computer Science
    and a Bachelor’s degree (2017) in Geography from the University of Zurich.
