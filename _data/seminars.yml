  speaker_title: Postdoc
  title: Global vegetation monitoring with probabilistic deep learning
  affiliation: Postdoc, University of Copenhagen
  time: 15:00 CET
  location: RISE Lund Office (Scheelevägen 17)
  city: RISE Lund Office (Scheelevägen 17)
  venue_address: RISE Lund Office (Scheelevägen 17)
  photo: /assets/images/speakers/2023-09-21-nico-lang.jpg
  abstract: Mapping forest structure on a global scale is an important component for
    understanding the Earth's carbon cycle and conserving biodiversity. Several new
    space missions have been developed to support these goals by measuring forest
    structure to estimate biomass and carbon stocks. To analyze the vast amount of
    remote sensing data, efficient modelling approaches are needed that are robust
    to the inherent noise in these data. Data-driven approaches, especially modern
    deep learning methods, promise great potential for interpreting and combining
    data from different space missions to estimate vegetation parameters with enhanced
    spatial and temporal resolution. This talk will present recent research results
    for global vegetation height mapping exploiting ESA's Sentinel-2 optical imagery
    and NASA's GEDI full waveform LIDAR. By integrating probabilistic deep learning
    approaches (i.e. deep ensembles), the predictive uncertainty of the models is
    quantified, which is crucial for downstream applications that depend on reliable
    estimates.
  bio: 'Nico is Postdoc at the University of Copenhagen associated with the Pioneer
    Centre for AI, where he is co-advised by Serge Belongie and Christian Igel. He
    received his PhD from ETH Zurich, where he was working in the EcoVision Lab that
