- id: '2023-05-25'
  date: '2023-05-25'
  speaker: Puzhao Zhang
  speaker_title: Postdoc
  title: Multi-Source Satellite Remote Sensing for Large-Scale Wildfire Burned Area
    Mapping Using Deep Learning
  affiliation: Postdoc, KTH
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-05-25-puzhao-zhang.jpg
  abstract: Wildfires are growing in intensity, frequency and extent around the globe,
    satellite remote sensing provides a cost-effective way to monitor wildfires and
    assess their environmental impacts over vast geographical areas, from local to
    global scale. Wildfire mapping and monitoring has long been hampered by the lack
    of data in high temporal and spatial resolution. A new era was started by the
    public release of 50 years’ Landsat data, and then boosted by the launch of Sentinel-1/2
    satellites, making satellite remote sensing play an increasingly important role
    in understanding environmental dynamics happening on our planet. Optical multispectral
    observations have long been used for mapping wildfires and assessing their impacts.
    Despite the satisfactory results produced by optical observations, difficulties
    may arise due to the presence of cloud cover, smoke, and haze, which could significantly
    reduce the observation frequency in the visible/infrared domain. SAR can penetrate
    through clouds and smoke, being capable of imaging day and night at all weather,
    therefore has great potential to complement optical observations. This talk will
    introduce our recent work on exploiting multi-source satellite remote sensing
    data for large-scale wildfire burned area mapping with deep learning.
  bio: Dr. Puzhao Zhang, researcher from the Division of Geoinformatics, KTH. He received
    his PhD degree in Geoinformatics from KTH in 2021. His postdoctoral position was
    funded by the Digital Futures Postdoctoral fellowship. He is co-editing a special
    issue “Multi-source Data with Remote Sensing Techniques” for the journal Remote
    Sensing. His research interests include satellite remote sensing big data analytics,
    geospatial machine learning, and environmental change monitoring.
  youtube_id: 8MfTPIFcoFg
  is_cain: false
- id: '2023-05-11'
  date: '2023-05-11'
  speaker: Jonathan Sauder
  speaker_title: PhD candidate
  title: Unsupervised Deep Learning-Based 3D Mapping from Video and its Applications
    to Underwater Mapping
  affiliation: PhD candidate, École polytechnique fédérale de Lausanne (EPFL)
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-05-11-jonathan-sauder.jpg
  abstract: 'As deep learning has revolutionized many areas of computer vision in
    recent years, conventional computer vision methods have held up in 3D mapping
    tasks: for many applications, classical photogrammetry yields more accurate results
    than methods involving deep learning. However, in challenging environments with
    challenging lighting conditions and dynamic objects, many of the assumptions underlying
    conventional methods are violated. In such environments, deep learning can produce
    great results when classical 3D mapping completely fails.,

    ,

    This talk introduces unsupervised deep learning-based 3D mapping, the challenges
    associated with it, and ways to overcome some of them. In particular, a link with
    unrolled optimization in inverse problems is established, framing the learning-based
    3D reconstruction process as an iterative procedure that can compete with the
    precision of conventional 3D mapping. We demonstrate the effectiveness of using
    learning-based 3D mapping for coral reef monitoring, delivering unprecedented
    scale and robustness.'
  bio: Jonathan Sauder is currently a PhD Student in Deep Learning at the Environmental
    Computational Science and Earth Observation (ECEO) Laboratory  Ecology at the
    École Polytechnique Fédérale de Lausanne (EPFL) in Switzerland. He completed his
    Bachelor’s degree in computer science at the University of Potsdam, and his Master’s
    degree in computer science with a focus on machine learning. In particular, his
    areas of interest were the intersection of optimization theory and signal processing
    with neural networks, as well as large-scale 3D deep learning.
  youtube_id: nc0IsFt7n6g
  is_cain: false
- id: '2023-05-04'
  date: '2023-05-04'
  speaker: Post Doctoral Researcher Ida Arvidsson
  title: Applications of AI in Medical Image Analysis
  affiliation: Lund University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2023-05-04-ida-arvidsson.jpg
  abstract: 'Many medical examinations are done based on various types of images.
    By using machine learning to analyse these images, some assessments could be done
    automatically. This has benefits such as reducing the workload for medical doctors,
    decreasing variations in diagnoses and reducing waiting times for the patient
    as well as improving the performance. However, there are still few AI tools that
    are used in the clinic and more research is needed.,

    ,

    In this talk we will look into a few applications where deep learning can be used
    for assessment of medical images. We will discuss some of the common problems
    when working with medical data, such as limited amount and limited diversity of
    data as well as uncertainties in ground truth. We will have a look at the problem
    of automatically grading prostate cancer in biopsies, something that could be
    used to earlier determine which patients who eventually will need treatment. Another
    example we will look at is detection of breast cancer using a point-of-care ultrasound
    probe together with machine learning. This could be a feasible tool for diagnosis
    in low- and middle-income countries that today are lacking any solution for examination.'
  bio: Ida Arvidsson is a postdoctoral researcher at the Division for Computer Vision
    and Machine Learning at the Centre for Mathematical Sciences, Lund University.
    She defended her Ph.D. in applied mathematics in 2021, titled "Applications of
    Deep Learning in Medical Image Analysis - Grading of Prostate Cancer and Detection
    of Coronary Artery Disease". Her main research interest is deep learning applied
    to medical images. She is working with projects applied to histopathology (grading
    of prostate cancer), dermatology (classification of skin cancer) and radiology
    (classification of breast cancer, detection of coronary artery disease and prediction
    of Alzheimer's disease).
  youtube_id: juqfBPv9aFk
