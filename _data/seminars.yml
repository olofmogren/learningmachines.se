- id: '2024-03-21'
  date: '2024-03-21'
  speaker: Postdoctoral Researcher Fredrik Gustafsson
  title: How reliable is your regression model's uncertainty under real-world distribution
    shifts?
  affiliation: Karolinska Institutet
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2024-03-21-fredrik-gustafsson.jpg
  abstract: 'Regression is a fundamental machine learning task with many important
    applications within computer vision and other domains. In general, it entails
    predicting continuous targets from given inputs. Within medical imaging, accurate
    regression models have the potential to automate various tasks, helping to lower
    costs and improve patient outcomes. Such safety-critical deployment does however
    require reliable estimation of model uncertainty, also under the wide variety
    of distribution shifts that might be encountered in practice.


    Motivated by this, we set out to investigate the reliability of regression uncertainty
    estimation methods under various real-world distribution shifts. To that end,
    we propose an extensive benchmark of eight image-based regression datasets with
    different types of challenging distribution shifts. We then employ our benchmark
    to evaluate many of the most common uncertainty estimation methods, as well as
    two state-of-the-art uncertainty scores from the task of out-of-distribution detection.


    We find that while methods are well calibrated when there is no distribution shift,
    they all become highly overconfident on many of the benchmark datasets. This uncovers
    important limitations of current uncertainty estimation methods, and the proposed
    benchmark therefore serves as a challenge to the research community. It demonstrates
    that more work is required in order to develop truly reliable uncertainty estimation
    methods for regression.'
  bio: Fredrik K. Gustafsson is postdoctoral researcher in the group of Mattias Rantalainen
    at Karolinska Institutet, working on machine learning and computer vision for
    computational pathology. His research focuses on how to build and evaluate reliable
    machine learning models, and has often included regression problems, uncertainty
    estimation methods or energy-based models. He received his PhD in Machine Learning
    in 2023 from Uppsala University for the thesis "Towards Accurate and Reliable
    Deep Regression Models", and received his MSc in Electrical Engineering from Linköping
    University in 2018.
  registration_url: extra2
