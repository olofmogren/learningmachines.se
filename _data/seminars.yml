- id: '2024-10-03'
  date: '2024-10-03'
  speaker: Jakob Ambsdorf
  speaker_title: PhD candidate
  title: Medical image analysis with limited labels
  affiliation: PhD candidate, University of Copenhagen & Pioneer Centre for AI
  time: 15:00 CET
  location: Scheelevägen 17, Lund
  city: Lund
  venue_address: Scheelevägen 17, Lund
  photo: /assets/images/speakers/2024-10-03-jakob-ambsdorf.jpg
  abstract: 'The application of Deep Learning to Medical Imaging has largely been
    enabled by the careful collection of image labels by medical domain experts. In
    this talk, I briefly review successful applications developed within SONAI, the
    Danish Fetal Ultrasound project, and show how they are made possible by collaborations
    between researchers from medical sciences and machine learning researchers. Through
    this case study, it is evident that the key part of these collaborations lies
    beyond simply providing labels for machine-learning datasets. However, the acquisition
    of manual labels is still a time-consuming and often necessary task that can hinder
    interdisciplinary teams from focusing on more relevant and productive aspects
    of research.


    With this motivation in mind, the main part of this talk focuses on self-supervised
    pre-training for label efficient learning in medical imaging, and unsupervised
    methods for solving tasks entirely without manual annotation. I present two of
    our recent works in detail: Firstly, AMAES is a framework for self-supervised
    pretraining of 3D brain segmentation models from MRI, and introduces the to-date
    largest collection of public pretraining datasets compiled in the 🧠BRAINS-45K
    dataset. We investigate how pretraining in a masked autoencoder framework can
    improve segmentation performance in the low label regime. Secondly, and returning
    to fetal ultrasound, I am presenting research on the unsupervised detection of
    fetal brain anomalies, without requiring segmentation labels and without relying
    on rare abnormal examples for training.'
  bio: Jakob Ambsdorf obtained his MSc in Computer Science at the University of Hamburg,
    where he specialized in machine learning and explainable AI with applications
    to computer vision and human-robot interaction. He is now a PhD student at the
    University of Copenhagen and the Pioneer Centre for AI, working on self-supervised
    learning for fetal ultrasound imaging with a focus on explainability and anomaly
    detection applications.
  registration_url: extra2
  youtube_id: YH3IcSQQy90
  is_cain: false
- id: '2024-09-26'
  date: '2024-09-26'
  speaker: Charlie Fieseler
  speaker_title: Postdoc
  title: How to build a brain
  affiliation: Postdoc, University of Vienna
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2024-09-26-charlie-fieseler.jpg
  abstract: 'A fundamental problem in neuroscience is how to design a brain to quickly
    achieve robust behavior while processing chaotic sensory input. Fortunately, neuroscience
    is undergoing a revolution due to large-scale high-resolution recording technologies.
    Recent research on such datasets suggests a general design principle: a distributed
    representation of instantaneous behavior across a large population of neurons,
    producing a low-dimensional manifold. Studying such principles in small C. elegans
    nematodes has unique benefits, because we can record the neuronal activity of
    almost every single neuron during natural behaviors.


    I will review recent work on large-scale brain recordings and manifolds, with
    particular reference to brain-computer interfaces. I will next discuss the historical
    cross-pollination of the neuroscience and AI fields, and then discuss lessons
    learned from reading the mind of this animal. We have observed the manifold concept
    to be extremely important even in this minimal system, and it may have particular
    relevance for engineers designing embedded systems that act in real time. In addition,
    I will introduce the neural networks and techniques used to transform our 3d microscopy
    videos into clean time series. I will end with some directions of future work
    modeling the dynamics of such neuronal systems, combining a sprinkle of control
    theory with neural networks.'
  bio: Charles Fieseler is a postdoc in the Zimmer lab at the University of Vienna.
    He did his Ph.D. in physics at the University of Washington, focusing on modeling
    neuronal activity using data-driven control theory. He is interested in developing
    practical pipelines for analyzing terabyte scale microscopy data, and in analyzing
    minimal brains and understanding their design principles.
  registration_url: extra2
  youtube_id: -Q-9cqbTJf8
  is_cain: false
- id: '2024-09-19'
  date: '2024-09-19'
  speaker: Mélisande Teng
  speaker_title: PhD student
  title: Species distribution modeling using remote sensing and citizen science data
  affiliation: PhD student, MILA and Universite de Montreal
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2024-09-19-melisande-teng.jpg
  abstract: 'Biodiversity is declining at an unprecedented rate, impacting ecosystem
    services and human wellbeing. A first step towards guiding biodiversity conservation
    policies is understanding the current state of biodiversity, and in particular,
    through mapping species to their habitat. However, there remain large knowledge
    gaps about species distribution, due to the amount of effort and expertise required
    for traditional field monitoring. Furthermore, traditional methods in ecology
    for species distribution modeling (SDM) are often unable to account for complex
    relationships between species and characteristics of the environment and generally
    focus either on narrow geographical areas or narrow sets of species, while species
    interact with each other. With the rise of citizen science, which offers rich
    and abundant data in comparison with field surveys, opening new possibilities
    to scientists, machine learning appears as a promising tool to model jointly species
    distributions.


    In this talk, I will focus on approaches to tackle the challenge of joint species
    distribution modeling at scale with machine learning. I will present SatBird,
    a dataset and benchmark for bird species distribution modeling using remote sensing
    and citizen science data and introduce methods to leverage partial information
    about species present in a given location to predict occurrence patterns of other
    species.  I will also share some personal learnings and reflections on applied
    research in ML for biodiversity conservation.'
  bio: Mélisande Teng is a PhD candidate in Computer Science at Université de Montréal
    / Mila - Quebec AI Institute and her research focuses on applications of machine
    learning and remote sensing for biodiversity monitoring, in particular, bird and
    butterfly species distribution modeling and carbon storage quantification in tree
    plantations. She aims at building bridges between the machine learning and ecology
    communities and the general public. She holds a MSc in Mathematics, Vision and
    Learning (MVA) from ENS Paris-Saclay and a Msc in Management and Social Entrepreneurship
    from ESSEC Business School.
  registration_url: extra2
  youtube_id: EqHIcCbQyGY
  is_cain: false
- id: '2024-09-05'
  date: '2024-09-05'
  speaker: Smita Chakraborty
  speaker_title: Researcher
  title: 'AI-SAXS: Decoding Structural Complexity with Intelligent Scattering Analysis'
  affiliation: Researcher, RISE Research Institutes of Sweden
  time: 15:00 CET
  location: Scheelevägen 17, Lund
  city: Lund
  venue_address: Scheelevägen 17, Lund
  photo: /assets/images/speakers/2024-09-05-smita-chakraborty.jpg
  abstract: The AI-SAXS project explores the possibilities of using machine learning
    to interpret the information in the small angle X-ray scattering curves together
    with project partners AstraZeneca and TetraPak. The model developed within the
    project will be trained on synthetic data and real experimental data from the
    Max IV synchrotron laboratory in Lund, Sweden. By training the model on thousands
    of SAXS spectra of representative models, it learns to interpret real samples
    that are of interest for the experiments in the project. One of the goals is to
    make the models and working methods as generalizable as possible given the diversity
    of the project focus samples which are primarily cellulose for TetraPak and lipid
    nanoparticles in the case of AstraZeneca. Both the work process and type of neural
    networks are evaluated in the project to find the best methods for these different
    materials.
  bio: Smita Chakraborty is a researcher at the Computer Science Department at RISE.
    She earned her Ph.D. in Theoretical Particle Physics from Lund University in 2022,
    where her doctoral thesis focused on extending the Lund String Model for heavy
    ion collisions at particle colliders such as CERN. Her current research interests
    are physics-informed machine learning, ML for earth observation, and quantum computation.
  registration_url: extra2
  youtube_id: ExmiQ9RSPL8
  is_cain: false
- id: '2024-05-30'
  date: '2024-05-30'
  speaker: Senior Lecturer Jonas Hentati Sundberg
  title: Sensors and AI in seabird research and monitoring
  affiliation: Swedish University of Agricultural Sciences
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2024-05-30-jonas-hentati-sundberg.jpg
  abstract: New sensor technologies and Artificial intelligence can speed up learning
    about species and populations and increase the utility of ecological field studies
    to inform environmental management. We have developed automated methods for monitoring
    of seabirds, which are often monitored for their high conservation value and for
    being sentinels for marine ecosystem changes. Using video surveillance combined
    with automated image processing, we continuously monitor breeding seabirds in
    a semi-natural environment – an artificial cliff in the middle of a large seabird
    colony on Stora Karlsö, Sweden. We demonstrate how computer vision-based object
    detection can be used to accurately monitor phenology and chick growth and generate
    surprising insights on disturbances from predators and impacts of heat waves.
    Ongoing development includes automated identification and quantification of behaviors,
    prey deliveries, automated weighing of birds and tracking and identification of
    individuals.
  bio: 'Jonas Hentati-Sundberg, Associate Professor in ecology at the Swedish University
    of Agricultural Sciences. Jonas obtained his PhD from Stockholm Resilience Centre
    (Stockholm University) 2015. PhD thesis title: "SEA CHANGE - Social-ecological
    co-evolution in Baltic Sea fisheries". His research interest concerns The use
    of Ai for biodiversity monitoring and applied research, in particular using video
    suveillance, animal-borne loggers and sailing drones, in marine systems. Novel
    hydro-acoustical tools (eg. broadband hydroacoustics, marine drones) for fish
    data collection, interactions between fish-eating seabirds (particularly common
    guillemot), fish stocks and fisheries, and dynamics of linked social-ecological
    systems (such as fisheries) and the role of management in shaping fisheries and
    other resource use systems. https://www.slu.se/cv/jonas-hentati-sundberg/'
