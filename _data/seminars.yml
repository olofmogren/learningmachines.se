- id: '2024-05-23'
  date: '2024-05-23'
  speaker: Shruti Nath
  title: 'Monthly climate model emulators: lightweight tools for agile exploration
    of future climate uncertainties'
  affiliation: University of Oxford and Climate Analytics
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2024-05-23-shruti-nath.jpg
  abstract: Climate models lay the foundation on which we can explore future climate
    scenarios and the impacts of anthropogenic greenhouse gas (GHG) emissions. They
    are process-driven models which solve a set of governing, physical equations over
    a discretized grid to prognose and diagnose a wide range of climate variables.
    Running climate models typically takes months and carries high computational costs
    for generating and storing realizations. This makes exploring uncertainties surrounding
    future emission trajectories, alongside other uncertainties – such as that due
    to natural climate variability – time consuming and computationally expensive.
    Climate model emulators are lightweight statistical tools that train on climate
    models to then approximate key relationships and properties of impact-relevant
    climate variables in a functionally identical manner. In this talk I will mainly
    discuss climate model emulator developments conducted on a monthly level and give
    examples of use-cases within extreme event attribution. I will furthermore talk
    about data compression techniques used when extending climate model emulator frameworks
    to multivariate emulations and give concrete examples of impacts that can be explored
    with such monthly, multivariate emulations.
  bio: Shruti Nath has a background in mathematics and completed her PhD jointly at
    the Berlin based NGO Climate Analytics and the Institute of Atmospheric and Climate
    Sciences at ETH Zürich. Her PhD involved lightweight emulator development, where
    she explored a range of statistical methods to approximate the uncertainty dimensions
    surrounding future climate scenarios. Dr. Nath is currently based at the University
    of Oxford as a Postdoctoral researcher.
  registration_url: extra2
  is_cain: false
- id: '2024-05-16'
  date: '2024-05-16'
  speaker: Research fellow Mikolaj Czerkawski
  title: Geographical Guidance in the Era of Large-Scale Earth Observation Data and
    AI
  affiliation: European Space Agency
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2024-05-16-mikolaj-czerkawski.jpg
  abstract: The current scale of available Earth observation data provides an unprecedented
    perspective on planet Earth. However, with the ever-expanding volumes of data
    and new tools designed for extracting insights, come new challenges and obstacles
    that must be addressed by the community. Some of the key questions centre around
    data and that is the focus of this talk - the challenges of building a collaborative,
    vibrant, and accessible ecosystem for Earth observation data with the aim to enable
    extracting valuable insight at scale. This talk provides a perspective on this
    topic and describes several ongoing research projects focused on the coordination
    of efforts to curate large-scale datasets for Earth observation (such as Major
    TOM) and on the topics of deriving highly abstract descriptions of environment
    at scale.
  bio: 'Mikolaj Czerkawski is a postdoctoral research fellow at the European Space
    Agency in ESRIN, Frascati, Italy. His research interests include data-centric
    analyses of large-scale Earth observation data, dataset curation, generative modelling,
    and restoration tasks for satellite imagery. He is a co-founder the Major TOM
    community project, which provides a platform for collaborating and reusing Earth
    observation datasets designed specifically for AI pipelines. He received the B.Eng.
    degree in electronic and electrical engineering in 2019 from the University of
    Strathclyde in Glasgow, United Kingdom, and the Ph.D. degree in 2023 at the same
    institution, specialising in applications of computer vision to Earth observation
    data. Homepage: https://mikonvergence.github.io/'
