- id: '2024-10-24'
  date: '2024-10-24'
  speaker: Ankit Kariryaa
  speaker_title: Assistant Professor
  title: Deep Learning for digital twins of individual trees
  affiliation: Assistant Professor, University of Copenhagen
  time: 15:00 CET
  location: Scheelevägen 17, Lund
  city: Lund
  venue_address: Scheelevägen 17, Lund
  photo: /assets/images/speakers/2024-10-24-ankit-kariryaa.jpg
  abstract: Recent advances in remote sensing and machine learning have made it possible
    to create digital twins of individual trees, providing unprecedented insights
    into their health and dynamics. My presentation will focus on the application
    of deep learning techniques in tree mapping and forest segmentation. I will showcase
    how neural networks are used to segment tree crowns from satellite imagery, enabling
    precise measurements of canopy area and tree distribution within and outside forests.
    Additionally, allometric equations will be applied to estimate biomass and stored
    carbon levels for individual trees.I will also explore the critical aspects of
    large-scale image processing pipelines and the selection of optimal satellite
    images for accurate mapping of individual trees across vast areas. Finally, I
    will delve into the self-supervised learning methods, which enable models to learn
    from large amounts of unlabeled data. By harnessing the vast quantities of satellite
    imagery and other remote sensing data, we can train models that can recognize
    patterns and features relevant to tree monitoring without human annotation.
  bio: Ankit Kariryaa is a tenure-track assistant professor of bridging geo- and AI-sciences,
    embedded in both the Department of Geosciences and Natural Resource Management
    and the Department of Computer Science at the University of Copenhagen. Ankit
    received his Ph.D. in Computer Science from the University of Bremen, Germany
    in 2020 with highest distinction. He is deeply passionate about advancing machine
    learning techniques to address environmental challenges and combat the climate
    crisis
  registration_url: extra2
  is_cain: false
- id: '2024-10-17'
  date: '2024-10-17'
  speaker: Matthias Obst
  speaker_title: Associate professor
  title: Digital Twins & observation systems for monitoring marine biodiversity and
    change
  affiliation: Associate professor, University of Gothenburg
  time: 15:00 CET
  location: Lindholmsallén 10, Gothenburg
  city: Gothenburg
  venue_address: Lindholmsallén 10, Gothenburg
  photo: /assets/images/speakers/2024-10-17-matthias-obst.jpg
  abstract: Biological monitoring needs to improve radically to serve our understanding
    of marine ecosystems and biodiversity under long-term global change and multiple
    stressors. Over the last decade many new monitoring technologies including genomics
    and image-based surveillance have become available to marine biologists. However,
    the transformation to such new high-throughput methods is not trivial as they
    produce enormous volumes of data. The Digital Twin of the Ocean (DTO) program
    of the European Commission will answer to these challenges and develop an analytical
    environment that brings together data, models, and algorithms to support effective
    monitoring, restoration, and management of marine ecosystems by 2030. Sweden plays
    an active role in the DTO program, and this talk will introduce some examples
    of new monitoring methods, tools and analytical services developed by Swedish
    partners, including the Genetic Biodiversity Observatory Networks and the Swedish
    platform for subsea image analysis (SUBSIM).
  bio: 'Matthias Obst has 17 years of experience as academic researcher, infrastructure
    developer, project manager and entrepreneur in the marine environmental sector.
    His scientific expertise is in the area of marine evolution, benthic ecology and
    biodiversity monitoring. In his research, he establishes and tests harmonized
    and automated observation systems for biological diversity in the sea, spanning
    from genetic sensors to citizen observatories. He is also developing methods and
    infrastructure to capture and integrate such data to enable inter-disciplinary
    research for the protection and management of marine life.


    He is the consortium chair of the Swedish Biodiversity Data Infrastructure (www.biodiversitydata.se)
    and responsible for user support and research on the infrastructure. As part of
    this assignment he is in the organising committee for the upcoming a conference
    on “Data-driven Ecology” https://biodiversitydata.se/event/sbdi-days-2024-towards-data-driven-ecology/.
    He developed one of the leading eDNA labs in the country (SweDNA lab), also including
    a commercial branch (www.seanalytics.se) for DNA-based monitoring. Their tools
    and services are used in both in evolutionary biology as well as conservation
    research.'
  registration_url: extra2
  youtube_id: W-lxAhyuM3Q
