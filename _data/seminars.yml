- id: '2022-09-01'
  date: '2022-09-01'
  speaker: Sofia Broomé
  speaker_title: PhD candidate
  title: 'Horses, pain and temporal information: Learning video features in low-data
    and fine-grained action recognition'
  affiliation: PhD candidate, Royal Institute of Technology (KTH)
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-09-01-sofia-broome.jpg
  abstract: "Recognition of pain in animals is important because pain compromises\
    \ animal welfare and can be a manifestation of disease. This is a difficult task\
    \ for veterinarians and caretakers, partly because horses, being prey animals,\
    \ display subtle pain behavior, and because they cannot verbalize their pain.\
    \ An automated video-based system has a large potential to improve the consistency\
    \ and efficiency of pain predictions.,\n,\n ,\n,\nVideo recording is desirable\
    \ for ethological studies because it interferes minimally with the animal, in\
    \ contrast to more invasive measurement techniques, such as accelerometers. Moreover,\
    \ to be able to say something meaningful about animal behavior, the subject needs\
    \ to be studied for longer than the exposure of single images. In deep learning,\
    \ we have not come as far for video as we have for single images, and even more\
    \ questions remain regarding what types of architectures should be used and what\
    \ these models are actually learning. Collecting video data with controlled moderate\
    \ pain labels is both laborious and involves real animals, and the amount of such\
    \ data should therefore be limited. The low-data scenario, in particular, is under-explored\
    \ in action recognition, in favor of the ongoing exploration of how well large\
    \ models can learn large datasets.,\n,\n ,\n,\nThe first theme of the talk is\
    \ automated recognition of pain in horses. Here, we propose a method for end-to-end\
    \ horse pain recognition from video, finding, in particular, that the temporal\
    \ modeling ability of the artificial neural network is important to improve the\
    \ classification. We surpass veterinarian experts on a dataset with horses undergoing\
    \ well-defined moderate experimental pain induction. Next, we investigate domain\
    \ transfer to another type of pain in horses: less defined, longer-acting and\
    \ lower-grade orthopedic pain. We find that a smaller, recurrent video model is\
    \ more robust to domain shift on a target dataset than a large, pre-trained, 3D\
    \ CNN, having equal performance on a source dataset. We also discuss challenges\
    \ with learning video features on real-world datasets.,\n,\n ,\n,\nMotivated by\
    \ questions arisen within the application area, the second theme of the talk is\
    \ empirical properties of deep video models. Here, we study the spatiotemporal\
    \ features that are learned by deep video models in end-to-end video classification\
    \ and propose an explainability method as a tool for such investigations. Further,\
    \ the question of whether different approaches to frame dependency treatment in\
    \ video models affect their cross-domain generalization ability is explored through\
    \ empirical study. We also propose new datasets for light-weight temporal modeling\
    \ and to investigate texture bias within action recognition."
  youtube_id: aDeqYc1lnOg
  is_cain: false
- id: '2022-06-02'
  date: '2022-06-02'
  speaker: Simon Pfreundschuh
  title: Improving satellite measurements of clouds and precipitation using machine
    learning
  affiliation: Chalmers University of Technology
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-06-02-simon-pfreundschuh.jpg
  abstract: 'Observing and measuring clouds and rain is essential for climate science,
    meteorology, and an increasing range of societal and economic activities. This
    is due to the importance of clouds and precipitation for the hydrological cycle
    and the weather and climate of the Earth. Since patterns of cloudiness and precipitation
    vary across continental scales, their study and monitoring require observations
    with global coverage, which currently can only be provided by satellite observations.,

    ,

    My research focuses on the development of machine-learning-based methods to improve
    satellite measurements of hydrometeors, i. e., the particles that make up clouds
    and precipitation. Since inferring the physical properties of hydrometeors from
    satellite observations constitutes an inverse problem, such predictions are endowed
    with significant uncertainties.,

    ,

    As part of my graduate studies, I have developed neural-network-based methods
    for the processing of satellite measurements that can handle the uncertainties
    caused by their inverse-problem character. These methods only require only minor
    changes to the training and architecture of the neural network and can be combined
    with any currently available architectures.,

    ,

    The methods have been successfully applied to the processing of observations from
    the Global Precipitation Measurement, an international satellite mission led by
    NASA and the Japanese Space Agency, as well as near real-time measurements of
    rain over Brazil. In both applications, the novel methods lead to considerable
    improvements in the accuracy of the satellite measurements.,

    ,

    The key advantage of the methods is that they allow combining the power of modern,
    deep neural networks with the mathematically sound handling of uncertainties offered
    by conventional methods for solving inverse problems. The methods unlocked significant
    improvements in global measurements of precipitation and will therefore be used
    operationally in the upcoming processing scheme for the Global Precipitation Measurement
    mission.'
  bio: Simon Pfreundschuh obtained a BSc in Computer Science from the University of
    Kiel and two MScs in Engineering Mathematics and Physics and Astronomy from Chalmers
    University of Technology. From 2017 until 2022 he was a graduate student at the
    Department of Space, Earth and Environment at Chalmers University of Technology.
    He was a visiting scholar at the Department of Atmospheric Science at Colorado
    State University for his work on the Global Precipitation Measurement satellite
    mission. He completed his graduate studies in May 2022 and will continue his work
    as a post-doctoral fellow at Chalmers University of Technology and associate scientist
    at the Swedish Meteorological and Hydrological Institute (SMHI).
  is_cain: false
- id: '2022-05-19'
  date: '2022-05-19'
  speaker: Marcus Liwicki, Frederik Sandin, and Karl Ekström
  title: Technical language supervision
  affiliation: Luleå University of Technology
  time: 15:00 CET
  location: Sweden / Live Stream
  abstract: In this presentation we will first give an overview of the recent achievements
    of the machine learning group at LTU and then dive deep into the young field of
    Technical Language (TL) Understanding and Supervision. Recent advances of NLP
    and NLU generated a vast amount of practically useful applications. When it comes
    to technical language with very domain-specific terms, however, the general deep
    learning models are not directly applicable. The terms, abbreviations and TL in
    general, create difficulties, as those do not appear in standard communication.
    We present algorithms to address these challenges and even benefit from typical
    structures in technical environments. The practical use is show-cased on an actual
    technical monitoring systems in process industry.
  bio: 'Marcus Liwicki is professor, Chair of Machine Learning and Vice-Rector for
    Applied AI at Luleå University of Technology and a senior assistant in the University
    of Fribourg. He received his PhD degree from the University of Bern, Switzerland,
    in 2007. His research interests include machine learning, pattern recognition,
    artificial intelligence, human computer interaction, digital humanities, knowledge
    management, ubiquitous intuitive input devices, document analysis, and graph matching.,

    Fredrik Sandin is a professor in Machine Learning at the Lulea University of Technology
    (LTU) in Sweden. He is interested in brain-inspired machine learning, neuromorphic
    computing, and applications requiring new efficient approaches to sensing, computing,
    and artificial intelligence. He has a Ph.D. in Physics (2007) from the Swedish
    Graduate School of Space Technology.,

    Karl Ekström is a PhD candidate at Luleå University of Technology. He is working
    in technical language processing and applies novel fundamental research results
    to real applications in the processing industry.'
  is_cain: false
- id: '2022-05-12'
  date: '2022-05-12'
  speaker: Fredrik Lindsten
  title: On uncertainty in machine learning
  affiliation: Linköping University
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-05-12-fredrik-lindsten.jpg
  abstract: The rapid development and deployment of machine learning systems is having
    a profound impact on our society. In recent years these systems have excelled
    in a wide range of data-driven prediction problems. However, in many cases, such
    as safety-critical applications, high predictive accuracy is not enough. To make
    the systems robust we also need to reliably reason about the uncertainties in
    their predictions. In this talk I will first discuss the notion of calibration
    as a fundamental requirement for probabilistic predictive models to report reliable
    uncertainty estimates. I will introduce a kernel-based calibration error that
    can be used to test for calibration for general probabilistic models. Second,
    I will discuss how label noise might influence both accuracy and calibration of
    a probabilistic classifier, and the role of so called robust loss functions in
    this setting.
  bio: Fredrik Lindsten is an associate professor and head of division at the division
    of statistics and machine learning at Linköping University, and a senior lecturer
    at the department of information technology, Uppsala University. Fredrik received
    his PhD in automatic control from Linköping University in 2013. During 2014 and
    2015 he was a postdoc at the department of engineering at the University of Cambridge.
    Fredrik has been a visiting researcher at the SAIL lab at University of California,
    Berkeley and at the department of statistics at the University of Oxford. His
    research interests are in probabilistic models, uncertainty quantification for
    machine learning, computational statistics and signal processing.
  youtube_id: TzPO5YR7b18
  is_cain: false
- id: '2022-05-05'
  date: '2022-05-05'
  speaker: Fredrik Carlsson
  title: Fine-grained controllable text generation using non-residual prompting,
  affiliation: RISE Research Institutes of Sweden
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-05-05-fredrik-carlsson.jpg
  abstract: The introduction of immensely large Causal Language Models (CLMs) has
    rejuvenated the interest in open-ended text generation. However, controlling the
    generative process for these Transformer-based models is at large an unsolved
    problem. Earlier work has explored either plug-and-play decoding strategies, or
    more powerful but blunt approaches such as prompting. There hence currently exists
    a trade-off between fine-grained control, and the capability for more expressive
    high-level instructions. To alleviate this trade-off, we propose an encoder-decoder
    architecture that enables intermediate text prompts at arbitrary time steps. We
    propose a resource-efficient method for converting a pre-trained CLM into this
    architecture, and demonstrate its potential on various experiments, including
    the novel task of contextualized word inclusion. Our method provides strong results
    on multiple experimental settings, proving itself to be both expressive and versatile.
  bio: Fredrik Carlsson is a researcher at RISE working on deep learning for language
    and vision and combinations of the two. He has published papers in venues such
    as ICLR and ACL on contrastive learning and representation learning for natural
    language processing.
