- id: '2026-09-24'
  date: '2026-09-24'
  speaker: Ana Lucic
  speaker_title: Associate Professor
  title: 'Aurora: A foundation model of the Earth system'
  affiliation: Associate Professor, University of Amsterdam
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2026-09-24-ana-lucic.jpg
  abstract: 'Reliable forecasting of the Earth system is essential for mitigating
    natural disasters and supporting human progress. Traditional numerical models,
    although powerful, are extremely computationally expensive1. Recent advances in
    artificial intelligence (AI) have shown promise in improving both predictive performance
    and efficiency, yet their potential remains underexplored in many Earth system
    domains. Here we introduce Aurora, a large-scale foundation model trained on more
    than one million hours of diverse geophysical data. Aurora outperforms operational
    forecasts in predicting air quality, ocean waves, tropical cyclone tracks and
    high-resolution weather, all at orders of magnitude lower computational cost.
    With the ability to be fine-tuned for diverse applications at modest expense,
    Aurora represents a notable step towards democratizing accurate and efficient
    Earth system predictions. These results highlight the transformative potential
    of AI in environmental forecasting and pave the way for broader accessibility
    to high-quality climate and weather information. Link to paper: https://www.nature.com/articles/s41586-025-09005-y'
  bio: Ana Lucic is an assistant professor in artificial intelligence at the University
    of Amsterdam working on interpretability, AI for science and AI safety. Previously,
    she was a researcher at Microsoft Research Amsterdam and at the Partnership on
    AI. She has a PhD in explainable machine learning from the University of Amsterdam,
    along with an MSc and BSc, both in mathematics, from McMaster University. Ana
    is a member of the European Laboratory for Learning and Intelligent Systems (ELLIS)
    and the Amsterdam ELLIS Unit. Her work has been published in venues such as Nature,
    ICML, AAAI, AISTATS, CVPR and FAccT.
  is_cain: true
- id: '2026-09-17'
  date: '2026-09-17'
  speaker: Jaime Caballer Revenga
  speaker_title: Postdoc
  title: Towards verified tree-level CO2 and H2O physiology, resolved at 30-min resolution
  affiliation: Postdoc, University of Copenhagen
  time: 15:00 CET
  location: RISE Lund Office (Scheelevägen 17)
  city: RISE Lund Office (Scheelevägen 17)
  venue_address: RISE Lund Office (Scheelevägen 17)
  photo: /assets/images/speakers/2026-09-17-jaime-caballer-revenga.jpg
  abstract: 'This project addresses one major challenge in climate science: accurately
    quantifying how forests remove carbon dioxide (CO₂) from the atmosphere. Forests
    currently account for nearly one-third of the global land carbon sink, but their
    capacity to absorb CO₂ is increasingly threatened by climate change(s), land-use
    change(s), and environmental disturbance(s). At the same time, afforestation,
    reforestation, and carbon offset initiatives are expanding rapidly, despite persistent
    concerns about the reliability and transparency of the methods used to estimate
    carbon sequestration.


    The INFOSCO project (Integrating Forest Structure and Carbon Observatories) proposes
    a new approach by shifting the focus from forest-scale carbon assessments to continuous
    physiological estimates at the level of individual trees. By combining ecosystem
    CO₂ flux observations, laser-based measurements of forest structure, and theory
    of plant physiological processes, it aims to estimate the contribution of each
    tree to overall forest carbon uptake. This will provide a more detailed and biologically
    grounded understanding of carbon sequestration while remaining consistent with
    established micrometeorological measurements and theory.


    Methodologically, the research integrates data and concepts from ecosystem ecology,
    laser proximal sensing, plant physiology, and statistical modelling into a unified
    framework. The core modelling strategy uses a Bayesian hierarchical structure
    to quantify uncertainties at multiple levels. By means of Dirichlet regression
    the method ensures  that tree-level estimates are consistent with ecosystem-scale
    micrometeorological observations.


    Beyond improving carbon accounting, the project aims to bridge between detailed
    field-based ecological measurements and AI models scalable to biogeographic applications.
    By linking high-resolution observations of individual trees with ecosystem-atmosphere
    fluxes, it seeks to advance both our understanding of forest physiology and the
    development of more robust tools for monitoring and verifying nature-based climate
    solutions.'
  bio: "Jaime C. Revenga was born in Madrid, Spain, and has developed his career across\
    \ France, Austria, Switzerland, and Denmark. Trained as energy and environmental\
    \ engineer, his previous research has focused on developing machine learning applications\
    \ in biogeography, environmental remote sensing (UAV-LiDAR), and modelling of\
    \ terrestrial ecosystem-atmosphere interactions. \n\nJaime earned his PhD in Geosciences\
    \ at the University of Copenhagen (2020-2023), developing UAV-LiDAR and ML methods\
    \ for biomass and carbon stock estimation in forests and croplands. \n\nHe is\
    \ currently a Postdoctoral Researcher at the Statistics and Probability Theory\
    \ group, at the Dept. of Mathematical Sciences, University of Copenhagen, on the\
    \ INFOSCO Project, where he models time-resolved tree-level carbon metabolism\
    \ and atmosphere-biosphere carbon interactions, from terrestrial laser scanning\
    \ and eddy-covariance observations. \n\nHis work now focuses on (i) applications\
    \ for ecosystem physiology predictive modelling and (ii) method development in\
    \ environmental imaging spectroscopy."
  youtube_id: YyWUYAdqK6s
