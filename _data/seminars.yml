- id: '2022-04-21'
  date: '2022-04-21'
  speaker: Jacob Zwart
  title: Stream temperature forecasts using process-guided deep learning and data
    assimilation in support of management decisions
  affiliation: U.S. Geological Survey
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-04-21-jacob-zwart.jpg
  abstract: Multiple and competing water demands can require complex water allocation
    decisions that must be made with imperfect information about the future. Near-term
    forecasts of environmental outcomes can inform real-time decision making by providing
    predicted future conditions with associated uncertainty. In this talk, we describe
    our approach of combining process-guided deep learning models with a data assimilation
    algorithm to generate 7-day forecasts of maximum stream water temperature in the
    Delaware River Basin to support New York City reservoir management decisions.
    We evaluate the forecast accuracy and reliability during the summer of 2021 and
    discuss future workflow and model improvements to better deliver valuable information
    in support of environmental management decisions.
  bio: Jake Zwart (he/him) is a data scientist at the U.S. Geological Survey (USGS)
    in the Data Science Branch of the Water Mission Area. Jake's work currently focuses
    on producing short-term forecasts of stream temperature at regional scales to
    aid in water resources decision making. The data science group at USGS has developed
    techniques to inject scientific knowledge into machine learning models (process-guided
    deep learning) to make accurate predictions of environmental variables, and developed
    methods for assimilating real-time observations into these models to improve near-term
    forecasts of water quality.
  is_cain: false
- id: '2022-04-07'
  date: '2022-04-07'
  speaker: Kyunghyun Cho
  title: Data augmentation for natural language processing /// Characterizing and
    addressing the issue of oversmoothing in neural autoregressive sequence modeling
  affiliation: NYU
  time: 15:00 CET
  location: Sweden / Live Stream
  photo: /assets/images/speakers/2022-04-07-kyunghyun-cho.jpg
  abstract: Neural autoregressive sequence models smear the probability among many
    possible sequences including degenerate ones, such as empty or repetitive sequences.
    In this work, we tackle one specific case where the model assigns a high probability
    to unreasonably short sequences. We define the oversmoothing rate to quantify
    this issue. After confirming the high degree of oversmoothing in neural machine
    translation, we propose to explicitly minimize the oversmoothing rate during training.
    We conduct a set of experiments to study the effect of the proposed regularization
    on both model distribution and decoding performance. We use a neural machine translation
    task as the testbed and consider three different datasets of varying size. Our
    experiments reveal three major findings. First, we can control the oversmoothing
    rate of the model by tuning the strength of the regularization. Second, by enhancing
    the oversmoothing loss contribution, the probability and the rank of <eos> token
    decrease heavily at positions where it is not supposed to be. Third, the proposed
    regularization impacts the outcome of beam search especially when a large beam
    is used. The degradation of translation quality (measured in BLEU) with a large
    beam significantly lessens with lower oversmoothing rate, but the degradation
    compared to smaller beam sizes remains to exist. From these observations, we conclude
    that the high degree of oversmoothing is the main reason behind the degenerate
    case of overly probable short sequences in a neural autoregressive model.
  bio: Kyunghyun Cho is an associate professor of computer science and data science
    at New York University and CIFAR Fellow of Learning in Machines & Brains. He is
    also a senior director of frontier research at the Prescient Design team within
    Genentech Research & Early Development (gRED). He was a research scientist at
    Facebook AI Research from June 2017 to May 2020 and a postdoctoral fellow at University
    of Montreal until Summer 2015 under the supervision of Prof. Yoshua Bengio, after
    receiving PhD and MSc degrees from Aalto University April 2011 and April 2014,
    respectively, under the supervision of Prof. Juha Karhunen, Dr. Tapani Raiko and
    Dr. Alexander Ilin. He tries his best to find a balance among machine learning,
    natural language processing, and life, but almost always fails to do so.
