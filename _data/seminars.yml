- id: '2026-03-19'
  date: '2026-03-19'
  speaker: Isabelle Tingzon
  speaker_title: PhD candidate
  title: 'Bridging data gaps in the Global South: Harnessing AI and Earth observation
    in the humanitarian sector'
  affiliation: PhD candidate, RISE Research Institutes of Sweden
  time: 15:00 CET
  location: Scheelevägen 17, Lund
  city: Lund
  venue_address: Scheelevägen 17, Lund
  photo: /assets/images/speakers/2026-03-19-isabelle-tingzon.jpg
  abstract: 'This talk highlights how AI and Earth Observation (EO) are transforming
    data availability for two global challenges: climate resilience and universal
    school connectivity. In the Caribbean, where extreme climatic hazards like hurricanes,
    floods, and landslides can devastate over 90% of built infrastructure across Small
    Island Developing States, comprehensive and up-to-date housing stock information
    is critical to enable resilient housing operations but is often incomplete, inaccessible,
    or completely non-existent. The “Digital Earth for Resilient Caribbean” initiative
    addresses these gaps by integrating EO data such as drone, LiDAR, satellite, and
    street-view imagery with AI workflows to classify roof types, materials, and building
    conditions. These efforts aim not only to enhance disaster response and recovery
    but also strengthen long-term resilience through government capacity building
    and knowledge exchange.

    In parallel, the presentation showcases UNICEF Giga’s mission to connect every
    school to the Internet by 2030. Reliable school location data is critical for
    planning telecommunications infrastructure, yet often inaccurate or incomplete
    in many low- and middle-income countries. By leveraging ML and satellite imagery,
    we’ve developed scalable pipelines to map schools across Africa on a nationwide
    scale, helping to ensure that no child is left behind in accessing digital learning
    opportunities. Together, these projects demonstrate how Geospatial AI can help
    bridge critical data gaps in the Global South, supporting both climate adaptation
    and inclusive education.'
  bio: Isabelle Tingzon is a doctoral researcher at RISE and PhD student at KTH. Previously,
    she was a Geospatial Data Scientist at the World Bank, where she spearheaded AI-driven
    climate adaptation projects in support of resilient housing operations.  She has
    also worked as a Data Science Consultant at UNICEF, where she led the development
    and deployment of UNICEF Giga’s AI-enabled school mapping pipeline across low-
    and middle-income countries. Her other projects span high-resolution poverty estimation,
    informal refugee settlement detection, and disaster- fragility, conflict, and
    violence assessment, in partnership with humanitarian organizations and non-profits
    in Southeast Asia, Latin America, the Middle East, and the Caribbean.
