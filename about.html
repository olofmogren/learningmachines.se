<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <link rel="canonical" href="/about/">
  <script>
    window.location.replace('/about/' + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <p>Redirecting to <a id="redirect-link" href="/about/">/about/</a>...</p>
  <script>
    document.getElementById('redirect-link').href = '/about/' + window.location.search + window.location.hash;
  </script>
</body>
</html>
